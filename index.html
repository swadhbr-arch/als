<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الدردشة الأسطورية | Legendary Chat</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-dark: #05050a;
            --bg-panel: rgba(20, 25, 40, 0.6);
            --neon-blue: #00f3ff;
            --neon-pink: #ff0055;
            --neon-green: #00ff66;
            --text-main: #f8fafc;
            --text-muted: #8892b0;
            --my-msg: linear-gradient(135deg, #00f3ff, #0055ff);
            --other-msg: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%; width: 100%; overflow: hidden; background-color: var(--bg-dark); color: var(--text-main);
            /* خلفية فضائية أسطورية */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 85, 0.08), transparent 25%);
        }

        .app-container {
            position: relative; width: 100%; max-width: 550px; height: 100dvh; 
            margin: 0 auto; display: flex; flex-direction: column;
            background: rgba(5, 5, 10, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.1); border-left: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05);
        }

        /* ===== شريط حقوق المطور ===== */
        .dev-banner {
            background: linear-gradient(90deg, rgba(0, 243, 255, 0.1), rgba(255, 0, 85, 0.1));
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center; padding: 10px; font-size: 0.85rem; font-weight: 700;
            color: #fff; flex-shrink: 0; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .dev-banner span { 
            color: var(--neon-blue); font-size: 1rem; font-weight: 900;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
        }

        /* ===== الشاشات ===== */
        .screen { display: none; flex-direction: column; flex: 1; height: 100%; overflow: hidden; }
        .screen.active { display: flex; }

        /* ===== 1. شاشة الدخول ===== */
        #loginScreen { padding: 20px; justify-content: center; align-items: center; }
        
        .login-card {
            width: 100%; background: var(--bg-panel); padding: 30px 20px; border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(15px); text-align: center;
        }

        .title { 
            font-size: 2rem; font-weight: 900; margin-bottom: 5px; 
            background: linear-gradient(to right, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }

        .input-group { margin-bottom: 15px; text-align: right; }
        .input-group label { display: block; color: #ccc; margin-bottom: 6px; font-weight: 700; font-size: 0.85rem;}
        .input-group input {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.4); color: #fff; font-size: 1rem; outline: none; text-align: center;
            transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }

        .divider { display: flex; align-items: center; color: #555; margin: 20px 0; font-size: 0.85rem; font-weight: bold;}
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
        .divider span { padding: 0 15px; }

        .btn {
            padding: 14px; font-size: 1rem; font-weight: 900; color: #000; 
            background: linear-gradient(135deg, #00f3ff, #00aaff);
            border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 243, 255, 0.5); }
        
        .btn-outline { 
            background: transparent; color: var(--neon-pink); border: 2px solid var(--neon-pink); 
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.1);
        }
        .btn-outline:hover { background: var(--neon-pink); color: #fff; box-shadow: 0 8px 25px rgba(255, 0, 85, 0.4); }

        /* ===== 2. شاشة الدردشة ===== */
        #chatScreen { background: transparent; }

        /* رأس الدردشة */
        .chat-header {
            background: rgba(15, 20, 30, 0.9); backdrop-filter: blur(10px);
            padding: 12px 20px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; z-index: 5;
        }
        
        .chat-header-info { display: flex; flex-direction: column; }
        .chat-room-code { font-weight: 900; font-size: 1.1rem; color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);}
        .chat-status { font-size: 0.75rem; color: var(--neon-green); display: flex; align-items: center; gap: 5px; font-weight: 600;}
        .chat-status::before { 
            content: ''; display: inline-block; width: 8px; height: 8px; background: var(--neon-green); 
            border-radius: 50%; box-shadow: 0 0 8px var(--neon-green); animation: pulse 1.5s infinite; 
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .btn-leave {
            background: rgba(255, 0, 85, 0.1); color: var(--neon-pink); border: 1px solid rgba(255, 0, 85, 0.3);
            padding: 8px 15px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.85rem;
            transition: 0.2s;
        }
        .btn-leave:hover { background: var(--neon-pink); color: #fff; }

        /* منطقة الرسائل */
        .chat-messages {
            flex: 1; padding: 20px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
        }
        
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.3); border-radius: 10px; }

        /* تصميم الرسائل */
        .message-wrapper { display: flex; flex-direction: column; max-width: 85%; animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .message-wrapper.me { align-self: flex-end; }
        .message-wrapper.other { align-self: flex-start; }

        .msg-name { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; font-weight: bold; margin-right: 5px;}
        
        .msg-bubble {
            padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word;
            position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .message-wrapper.me .msg-bubble { 
            background: var(--my-msg); color: #fff; border-bottom-right-radius: 4px; 
            border: 1px solid rgba(255,255,255,0.2);
        }
        .message-wrapper.other .msg-bubble { 
            background: var(--other-msg); color: #fff; border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(5px);
        }

        .msg-time { font-size: 0.6rem; opacity: 0.6; margin-top: 5px; text-align: left; display: block;}

        /* مؤشر الكتابة */
        .typing-indicator {
            display: none; align-self: flex-start; background: var(--other-msg); 
            padding: 12px 16px; border-radius: 18px; border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05); margin-top: 5px;
        }
        .typing-indicator.active { display: flex; gap: 4px; align-items: center; }
        .dot {
            width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* حقل الإدخال */
        .chat-input-area {
            padding: 12px 15px; background: rgba(15, 20, 30, 0.95); backdrop-filter: blur(10px);
            display: flex; gap: 10px; align-items: center; flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.05); padding-bottom: max(12px, env(safe-area-inset-bottom));
        }

        .input-wrapper {
            flex: 1; display: flex; background: rgba(0,0,0,0.4); border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1); padding: 5px 15px; align-items: center;
            transition: 0.3s;
        }
        .input-wrapper:focus-within { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 243, 255, 0.15); }

        .chat-input-area input {
            flex: 1; min-width: 0; padding: 10px 5px; border: none; background: transparent;
            color: #fff; outline: none; font-size: 0.95rem;
        }

        .btn-send {
            width: 48px; height: 48px; border-radius: 50%; 
            background: linear-gradient(135deg, #00f3ff, #0055ff); color: #fff;
            border: none; cursor: pointer; display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; flex-shrink: 0; transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
        .btn-send:hover { transform: scale(1.1) rotate(-10deg); }
        .btn-send:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- شريط حقوق المطور -->
        <div class="dev-banner">
            تطوير المبدع: <span>عبدالرحيم الجياشي الشمري</span>
        </div>

        <!-- 1. شاشة الدخول -->
        <div class="screen active" id="loginScreen">
            <div class="login-card">
                <div class="title">الدردشة الأسطورية</div>
                <div class="subtitle">تواصل مع صديقك بتصميم خرافي ⚡</div>
                
                <div class="input-group">
                    <label>اسمك المستعار:</label>
                    <input type="text" id="playerName" placeholder="اكتب اسمك..." maxlength="15">
                </div>
                
                <button class="btn" id="createRoomBtn"><i class="fas fa-rocket"></i> إنشاء غرفة جديدة</button>
                
                <div class="divider"><span>أو</span></div>
                
                <div class="input-group">
                    <label>كود الغرفة (للدخول):</label>
                    <input type="text" id="roomCodeInput" placeholder="مثال: A7B2" style="text-transform: uppercase;" maxlength="6">
                </div>
                <button class="btn btn-outline" id="joinRoomBtn"><i class="fas fa-sign-in-alt"></i> انضم للغرفة</button>
            </div>
        </div>

        <!-- 2. شاشة الدردشة -->
        <div class="screen" id="chatScreen">
            
            <!-- رأس الدردشة -->
            <div class="chat-header">
                <div class="chat-header-info">
                    <span class="chat-room-code" id="displayRoomCode">الغرفة: ----</span>
                    <span class="chat-status" id="onlineStatus">متصل الآن</span>
                </div>
                <button class="btn-leave" id="leaveRoomBtn"><i class="fas fa-door-open"></i> خروج</button>
            </div>

            <!-- الرسائل -->
            <div class="chat-messages" id="chatMessages">
                <!-- ستظهر الرسائل هنا -->
            </div>

            <!-- مؤشر الكتابة -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>

            <!-- حقل الإدخال -->
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
                </div>
                <button class="btn-send" id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // 1. إعدادات Firebase
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQa9TnbuCCPqfnXY-T9t-uwag0J2WEnFI",
            authDomain: "arrahimm.firebaseapp.com",
            databaseURL: "https://arrahimm-default-rtdb.firebaseio.com/",
            projectId: "arrahimm",
            storageBucket: "arrahimm.firebasestorage.app",
            messagingSenderId: "150237867312",
            appId: "1:150237867312:web:364d67877f9ff4d2bbacf5"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // ==========================================
        // 2. المتغيرات
        // ==========================================
        let myName = "";
        let currentRoom = "";
        let messagesListener = null;
        let typingTimeout = null;
        let isTyping = false;
        let lastMessageCount = 0;

        // العناصر
        const loginScreen = document.getElementById('loginScreen');
        const chatScreen = document.getElementById('chatScreen');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const typingIndicator = document.getElementById('typingIndicator');

        // أصوات الإشعارات (Web Audio API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        function playNotificationSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // ==========================================
        // 3. إنشاء ودخول الغرف
        // ==========================================
        document.getElementById('createRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            enterChat(code);
        });

        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            if (!code) return alert("الرجاء كتابة كود الغرفة");
            enterChat(code);
        });

        function enterChat(roomCode) {
            currentRoom = roomCode;
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');
            document.getElementById('displayRoomCode').textContent = `الغرفة: ${currentRoom}`;
            
            chatMessages.innerHTML = '';
            chatInput.value = '';
            lastMessageCount = 0;
            
            setupPresence(); // تفعيل حالة الاتصال
            listenForMessages();
            listenForTyping();
        }

        // ==========================================
        // 4. نظام الحالة (Online/Offline)
        // ==========================================
        function setupPresence() {
            const userStatusRef = db.ref(`chats/${currentRoom}/users/${myName}`);
            
            // عند الدخول
            userStatusRef.set({ status: 'online', last_seen: Date.now() });
            
            // عند الخروج أو انقطاع الاتصال
            userStatusRef.onDisconnect().set({ status: 'offline', last_seen: Date.now() });

            // مراقبة حالة الطرف الآخر
            db.ref(`chats/${currentRoom}/users`).on('value', (snapshot) => {
                const users = snapshot.val();
                if(!users) return;
                
                let opStatus = "غير متصل";
                let isOnline = false;
                
                for(let user in users) {
                    if(user !== myName && users[user].status === 'online') {
                        opStatus = `${user} متصل الآن`;
                        isOnline = true;
                    }
                }
                
                const statusEl = document.getElementById('onlineStatus');
                statusEl.textContent = opStatus;
                statusEl.style.color = isOnline ? 'var(--neon-green)' : 'var(--text-muted)';
                statusEl.style.setProperty('--neon-green', isOnline ? 'var(--neon-green)' : '#555');
            });
        }

        // ==========================================
        // 5. الدردشة الفورية
        // ==========================================
        function listenForMessages() {
            if (messagesListener) {
                db.ref('chats/' + currentRoom + '/messages').off('value', messagesListener);
            }

            const messagesRef = db.ref('chats/' + currentRoom + '/messages');
            
            messagesListener = messagesRef.on('value', (snapshot) => {
                const data = snapshot.val();
                const currentCount = data ? Object.keys(data).length : 0;
                
                // تشغيل صوت إذا كانت هناك رسالة جديدة وليست مني
                if (currentCount > lastMessageCount && lastMessageCount !== 0) {
                    const msgs = Object.values(data).sort((a,b) => a.timestamp - b.timestamp);
                    const lastMsg = msgs[msgs.length - 1];
                    if(lastMsg.sender !== myName) playNotificationSound();
                }
                lastMessageCount = currentCount;

                chatMessages.innerHTML = ''; 
                
                if (!data) {
                    chatMessages.innerHTML = '<div style="text-align:center; color:#555; margin-top:20px; font-size:0.9rem;"><i class="fas fa-comment-slash"></i> لا توجد رسائل بعد. ابدأ المحادثة!</div>';
                    return;
                }

                const messagesArray = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                messagesArray.sort((a, b) => a.timestamp - b.timestamp);

                messagesArray.forEach(msg => {
                    const isMe = msg.sender === myName;
                    const wrapper = document.createElement('div');
                    wrapper.className = `message-wrapper ${isMe ? 'me' : 'other'}`;
                    
                    const nameHtml = isMe ? '' : `<div class="msg-name">${msg.sender}</div>`;
                    
                    // تنسيق الوقت
                    const date = new Date(msg.timestamp);
                    const timeString = date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

                    wrapper.innerHTML = `
                        ${nameHtml}
                        <div class="msg-bubble">
                            ${msg.text}
                            <span class="msg-time">${timeString}</span>
                        </div>
                    `;
                    
                    chatMessages.appendChild(wrapper);
                });

                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        // إرسال الرسالة
        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || !currentRoom) return;

            db.ref('chats/' + currentRoom + '/messages').push({
                sender: myName,
                text: text,
                timestamp: Date.now()
            }).then(() => {
                chatInput.value = '';
                chatInput.focus();
                // إخفاء مؤشر الكتابة فور الإرسال
                db.ref(`chats/${currentRoom}/typing/${myName}`).set(false);
            });
        }

        document.getElementById('sendChatBtn').addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        // ==========================================
        // 6. مؤشر الكتابة (Typing Indicator)
        // ==========================================
        function listenForTyping() {
            db.ref(`chats/${currentRoom}/typing`).on('value', (snapshot) => {
                const typingData = snapshot.val();
                if (!typingData) return;

                let isOtherTyping = false;
                for (let user in typingData) {
                    if (user !== myName && typingData[user] === true) {
                        isOtherTyping = true;
                    }
                }

                if (isOtherTyping) typingIndicator.classList.add('active');
                else typingIndicator.classList.remove('active');
            });
        }

        chatInput.addEventListener('input', () => {
            if (!isTyping) {
                isTyping = true;
                db.ref(`chats/${currentRoom}/typing/${myName}`).set(true);
            }
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                isTyping = false;
                db.ref(`chats/${currentRoom}/typing/${myName}`).set(false);
            }, 2000);
        });

        // ==========================================
        // 7. الخروج
        // ==========================================
        document.getElementById('leaveRoomBtn').addEventListener('click', () => {
            if (confirm("هل تريد الخروج من الغرفة؟")) {
                db.ref(`chats/${currentRoom}/users/${myName}`).set({ status: 'offline', last_seen: Date.now() });
                if (messagesListener) db.ref('chats/' + currentRoom + '/messages').off('value', messagesListener);
                db.ref(`chats/${currentRoom}/typing`).off();
                db.ref(`chats/${currentRoom}/users`).off();
                
                chatScreen.classList.remove('active');
                loginScreen.classList.add('active');
                currentRoom = "";
            }
        });
    </script>
</body>
</html>
