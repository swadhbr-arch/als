<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Reflex | Stage Mode</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --neon-red: #ff0055;
            --neon-gold: #ffcc00;
            --neon-green: #00ff66;
            --bg-color: #050510;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle at center, rgba(0, 243, 255, 0.06) 0%, transparent 65%);
        }

        .game-container {
            position: relative;
            width: 100%; max-width: 500px; height: 100vh; max-height: 850px;
            background: rgba(10, 15, 30, 0.88);
            border: 2px solid rgba(0, 243, 255, 0.22);
            border-radius: 1rem;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.15), inset 0 0 20px rgba(0, 243, 255, 0.1);
            overflow: hidden;
            cursor: crosshair;
            display: flex; flex-direction: column;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.4s;
        }

        .game-container.dark-mode {
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.14) 0px, rgba(2,2,8,0.97) 130px);
        }

        .game-container.shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--neon-red);
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.4), inset 0 0 30px rgba(255, 0, 85, 0.2);
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* ===== شريط الحالة العلوي ===== */
        .hud {
            padding: 0.9rem 1.1rem;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(5,5,16,0.95) 0%, transparent 100%);
            display: flex; flex-direction: column; gap: 8px;
        }

        .hud-top {
            display: flex; justify-content: space-between; align-items: center; gap: 6px;
        }

        .stat-box { display: flex; flex-direction: column; align-items: center; min-width: 55px; }
        .stat-label { font-size: 0.68rem; color: #8892b0; font-weight: 700; letter-spacing: 0.5px; }
        .stat-value { font-size: 1.4rem; font-weight: 900; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); line-height: 1.1; }
        
        .stage-value { color: var(--neon-gold); text-shadow: 0 0 10px var(--neon-gold); }
        .time-value { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }
        .combo-value { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }

        .hud-controls {
            display: flex; gap: 8px; pointer-events: auto;
        }

        .icon-btn {
            width: 36px; height: 36px; border-radius: 10px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: rgba(0, 243, 255, 0.2); border-color: var(--neon-blue); }

        .mission-bar {
            background: rgba(255,255,255,0.09); border-radius: 10px; padding: 6px 12px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.85rem; font-weight: 700; color: #fff;
            border: 1px solid rgba(255,255,255,0.18);
        }
        .mission-target { color: var(--neon-blue); font-size: 1rem; }

        .time-bar-bg {
            width: 100%; height: 6px; background: rgba(255,255,255,0.1);
            border-radius: 10px; overflow: hidden; position: relative;
        }
        .time-bar-fill {
            height: 100%; width: 100%; background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
            transition: width 1s linear, background-color 0.3s;
        }

        /* ===== الأهداف ===== */
        .target {
            position: absolute; border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            cursor: pointer; z-index: 5; display: none;
            transition: left 0.08s ease-out, top 0.08s ease-out;
        }

        .target.normal {
            width: 55px; height: 55px;
            background: var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 15px #fff;
        }

        .target.gold {
            width: 55px; height: 55px;
            background: var(--neon-gold);
            box-shadow: 0 0 25px var(--neon-gold), inset 0 0 15px #fff;
            border: 2px solid #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .target.gold::after {
            content: '\f005'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            font-size: 1.5rem; color: #fff; text-shadow: 0 0 5px #000;
        }

        .target.bomb {
            width: 55px; height: 55px;
            background: var(--neon-red);
            box-shadow: 0 0 25px var(--neon-red), inset 0 0 15px #fff;
            border: 2px solid #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .target.bomb::after {
            content: '\f1e2'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            font-size: 1.5rem; color: #fff;
        }

        .target.active {
            display: flex;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn { to { transform: translate(-50%, -50%) scale(1); } }

        .target.moving {
            animation: popIn 0.2s forwards, floatTarget 1.5s infinite alternate ease-in-out;
        }
        @keyframes floatTarget {
            0% { margin-left: -32px; margin-top: -20px; }
            100% { margin-left: 32px; margin-top: 20px; }
        }

        .target.shrinking {
            animation: popIn 0.2s forwards, shrinkAnim 1.4s linear forwards;
        }
        @keyframes shrinkAnim {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(0.25); opacity: 0.25; }
        }

        .target.glitchy {
            border-radius: 28%;
            animation: popIn 0.2s forwards, glitchSpin 0.85s infinite linear;
        }
        @keyframes glitchSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); filter: hue-rotate(0deg); }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(0.75); filter: hue-rotate(180deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); filter: hue-rotate(360deg); }
        }

        .target.bouncy {
            animation: popIn 0.2s forwards, bounceWild 0.7s infinite alternate cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        @keyframes bounceWild {
            0% { transform: translate(-50%, -50%) translateY(-35px) scale(1.1); }
            100% { transform: translate(-50%, -50%) translateY(35px) scale(0.85); }
        }

        .target.ghost {
            animation: popIn 0.2s forwards, ghostFade 1.2s infinite ease-in-out;
        }
        @keyframes ghostFade {
            0%, 100% { opacity: 1; }
            45%, 55% { opacity: 0.12; }
        }

        /* ===== الجزيئات والنصوص ===== */
        .particle {
            position: absolute; border-radius: 50%; pointer-events: none; z-index: 4;
            transform: translate(-50%, -50%); animation: explode 0.6s ease-out forwards;
        }
        @keyframes explode {
            to { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0); opacity: 0; }
        }

        .floating-text {
            position: absolute; font-size: 1.4rem; font-weight: 900;
            pointer-events: none; z-index: 20;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 10px currentColor;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1.2); opacity: 0; }
        }

        /* ===== الشاشات ===== */
        .overlay {
            position: absolute; inset: 0; background: rgba(5, 5, 16, 0.95);
            backdrop-filter: blur(12px); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 30;
            text-align: center; padding: 1.6rem; transition: opacity 0.3s ease;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }

        .game-title { font-size: 2.4rem; font-weight: 900; color: #fff; margin-bottom: 0.5rem; text-shadow: 0 0 15px rgba(255, 255, 255, 0.5); }
        .game-title span { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }
        .game-desc { font-size: 0.98rem; color: #a0aabf; margin-bottom: 1.6rem; line-height: 1.6; }

        .btn-group {
            display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 290px;
        }

        .btn {
            padding: 0.9rem 2rem; font-size: 1.1rem; font-weight: 800;
            color: #000; background: var(--neon-blue); border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 0 20px var(--neon-blue); transition: all 0.2s;
            display: flex; align-items: center; gap: 10px; justify-content: center;
        }
        .btn:hover { background: #fff; box-shadow: 0 0 30px #fff, 0 0 10px var(--neon-blue); transform: scale(1.04); }

        .btn-secondary {
            background: rgba(255, 204, 0, 0.14);
            color: var(--neon-gold);
            border: 2px solid var(--neon-gold);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
        }
        .btn-secondary:hover {
            background: var(--neon-gold);
            color: #000;
        }

        /* ===== شاشة اختيار المراحل ===== */
        #stageSelectScreen {
            justify-content: flex-start;
            padding-top: 1.5rem;
            overflow-y: auto;
        }

        .select-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .select-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 12px var(--neon-blue);
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            padding-bottom: 1rem;
        }

        .level-card {
            background: linear-gradient(145deg, rgba(0, 243, 255, 0.16), rgba(15, 25, 50, 0.9));
            border: 2px solid rgba(0, 243, 255, 0.45);
            border-radius: 14px;
            padding: 0.85rem 0.4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
        }

        .level-card:hover:not(.locked) {
            transform: translateY(-4px) scale(1.03);
            border-color: var(--neon-gold);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.35);
        }

        .level-card.locked {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.12);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .level-num {
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            line-height: 1;
        }

        .level-name {
            font-size: 0.7rem;
            color: #a0aabf;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .level-stars {
            display: flex;
            gap: 3px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
        }

        .level-stars .earned {
            color: var(--neon-gold);
            text-shadow: 0 0 8px var(--neon-gold);
        }

        .lock-icon {
            font-size: 1.4rem;
            color: #8892b0;
            margin: 4px 0;
        }

        /* شاشة نجاح المرحلة */
        #stageClearScreen { background: rgba(5, 15, 5, 0.95); }
        .stage-clear-title { color: var(--neon-green); text-shadow: 0 0 20px var(--neon-green); font-size: 2.7rem; margin-bottom: 0.6rem; animation: pulse 1s infinite alternate; }
        .earned-stars-box { font-size: 2rem; margin-bottom: 1rem; display: flex; gap: 10px; justify-content: center; }
        .earned-stars-box .earned { color: var(--neon-gold); text-shadow: 0 0 15px var(--neon-gold); }
        .earned-stars-box .empty { color: rgba(255,255,255,0.2); }

        @keyframes pulse { from { transform: scale(0.96); } to { transform: scale(1.04); } }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-bottom: 1.6rem; }
        .stat-item { background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); }
        .stat-item span { display: block; }
        .stat-item .val { font-size: 1.5rem; font-weight: 900; color: var(--neon-blue); }
        .stat-item .lbl { font-size: 0.8rem; color: #8892b0; }
    </style>
</head>
<body>

    <div class="game-container" id="gameArea">
        
        <!-- شريط الحالة -->
        <div class="hud">
            <div class="hud-top">
                <div class="stat-box">
                    <span class="stat-label">النقاط</span>
                    <span class="stat-value" id="scoreDisplay">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">المرحلة</span>
                    <span class="stat-value stage-value" id="stageDisplay">1</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">الوقت</span>
                    <span class="stat-value time-value" id="timeDisplay">20</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">كومبو</span>
                    <span class="stat-value combo-value" id="comboDisplay">x1</span>
                </div>
                <div class="hud-controls">
                    <button class="icon-btn" id="soundBtn" title="الصوت"><i class="fas fa-volume-up"></i></button>
                    <button class="icon-btn" id="levelsMenuBtn" title="المراحل"><i class="fas fa-th-large"></i></button>
                </div>
            </div>
            
            <div class="mission-bar">
                <span>المهمة: اصطد <span class="mission-target" id="missionCurrent">0</span> / <span id="missionRequired">10</span></span>
                <span id="stageObjective" style="color: var(--neon-gold);">الإحماء</span>
            </div>

            <div class="time-bar-bg">
                <div class="time-bar-fill" id="timeBar"></div>
            </div>
        </div>

        <!-- الهدف -->
        <div class="target" id="target"></div>

        <!-- شاشة البداية -->
        <div class="overlay" id="startScreen">
            <h1 class="game-title">NEON <span>STAGES</span></h1>
            <p class="game-desc">15 مرحلة غريبة وممتعة، نجوم ذهبية، قنابل، وكومبو سريع!<br>اجمع 3 نجوم في كل مرحلة وأثبت سرعتك.</p>
            <div class="btn-group">
                <button class="btn" id="startBtn"><i class="fas fa-play"></i> ابدأ اللعب</button>
                <button class="btn btn-secondary" id="openLevelsBtn"><i class="fas fa-th-large"></i> اختيار المرحلة</button>
            </div>
        </div>

        <!-- شاشة اختيار المراحل -->
        <div class="overlay hidden" id="stageSelectScreen">
            <div class="select-header">
                <h2 class="select-title">خريطة المراحل</h2>
                <button class="icon-btn" id="closeLevelsBtn" title="عودة"><i class="fas fa-arrow-right"></i></button>
            </div>
            <div class="levels-grid" id="levelsGrid"></div>
        </div>

        <!-- شاشة نجاح المرحلة -->
        <div class="overlay hidden" id="stageClearScreen">
            <h1 class="stage-clear-title">STAGE CLEAR!</h1>
            <div class="earned-stars-box" id="clearStarsBox"></div>
            <p class="game-desc" style="color: #fff; font-size: 1.1rem; margin-bottom: 1.2rem;">أحسنت! لقد اجتزت المرحلة بنجاح.</p>
            <div class="btn-group">
                <button class="btn" id="nextStageBtn" style="background: var(--neon-green); box-shadow: 0 0 20px var(--neon-green); color: #000;">المرحلة التالية <i class="fas fa-arrow-left"></i></button>
                <button class="btn btn-secondary" id="clearToLevelsBtn"><i class="fas fa-th-large"></i> قائمة المراحل</button>
            </div>
        </div>

        <!-- شاشة النهاية -->
        <div class="overlay hidden" id="endScreen">
            <h1 class="game-title" id="endTitle" style="color: var(--neon-red);">انتهت اللعبة</h1>
            <p class="game-desc" id="endMessage" style="color: var(--neon-red); font-weight: bold;"></p>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="val" id="finalScore">0</span>
                    <span class="lbl">النقاط</span>
                </div>
                <div class="stat-item">
                    <span class="val" id="finalStage" style="color: var(--neon-gold);">1</span>
                    <span class="lbl">المرحلة الحالية</span>
                </div>
            </div>
            
            <div class="btn-group">
                <button class="btn" id="restartBtn"><i class="fas fa-rotate-right"></i> إعادة المحاولة</button>
                <button class="btn btn-secondary" id="endToLevelsBtn"><i class="fas fa-th-large"></i> قائمة المراحل</button>
            </div>
        </div>

    </div>

    <script>
        // ================= إعدادات المراحل (15 مرحلة غريبة وممتعة) =================
        const stagesConfig = [
            { stage: 1,  name: "الإحماء",            required: 10, time: 20, hasBombs: false, hasGold: false, isMoving: false, isShrinking: false, isEvading: false, isGlitchy: false, isDark: false, isBouncy: false, isMagnetic: false, isGhost: false, speed: 1050 },
            { stage: 2,  name: "احذر القنابل",      required: 12, time: 20, hasBombs: true,  hasGold: true,  isMoving: false, isShrinking: false, isEvading: false, isGlitchy: false, isDark: false, isBouncy: false, isMagnetic: false, isGhost: false, speed: 950  },
            { stage: 3,  name: "الأهداف المتحركة", required: 14, time: 22, hasBombs: true,  hasGold: true,  isMoving: true,  isShrinking: false, isEvading: false, isGlitchy: false, isDark: false, isBouncy: false, isMagnetic: false, isGhost: false, speed: 900  },
            { stage: 4,  name: "الدقة والسرعة",    required: 15, time: 22, hasBombs: true,  hasGold: true,  isMoving: true,  isShrinking: true,  isEvading: false, isGlitchy: false, isDark: false, isBouncy: false, isMagnetic: false, isGhost: false, speed: 850  },
            { stage: 5,  name: "الهدف الهارب",      required: 14, time: 25, hasBombs: true,  hasGold: true,  isMoving: false, isShrinking: false, isEvading: true,  isGlitchy: false, isDark: false, isBouncy: false, isMagnetic: false, isGhost: false, speed: 1100 },
            { stage: 6,  name: "الخداع البصري",    required: 16, time: 24, hasBombs: true,  hasGold: true,  isMoving: true,  isShrinking: false, isEvading: false, isGlitchy: true,  isDark: false, isBouncy: false, isMagnetic: false, isGhost: false, speed: 900  },
            { stage: 7,  name: "الظلام النيوني",    required: 15, time: 25, hasBombs: true,  hasGold: true,  isMoving: false, isShrinking: false, isEvading: false, isGlitchy: false, isDark: true,  isBouncy: false, isMagnetic: false, isGhost: false, speed: 950  },
            { stage: 8,  name: "الجاذبية المقلوبة", required: 18, time: 25, hasBombs: true,  hasGold: true,  isMoving: false, isShrinking: false, isEvading: false, isGlitchy: false, isDark: false, isBouncy: true,  isMagnetic: false, isGhost: false, speed: 850  },
            { stage: 9,  name: "الفوضى الكهربائية",required: 20, time: 26, hasBombs: true,  hasGold: true,  isMoving: true,  isShrinking: true,  isEvading: true,  isGlitchy: false, isDark: false, isBouncy: false, isMagnetic: false, isGhost: false, speed: 750  },
            { stage: 10, name: "التحدي الأسطوري",  required: 22, time: 28, hasBombs: true,  hasGold: true,  isMoving: true,  isShrinking: true,  isEvading: true,  isGlitchy: true,  isDark: false, isBouncy: true,  isMagnetic: false, isGhost: false, speed: 700  },
            { stage: 11, name: "المغناطيس العكسي", required: 18, time: 24, hasBombs: true,  hasGold: true,  isMoving: false, isShrinking: false, isEvading: false, isGlitchy: false, isDark: false, isBouncy: false, isMagnetic: true,  isGhost: false, speed: 900  },
            { stage: 12, name: "الشبح المتنكر",    required: 18, time: 25, hasBombs: true,  hasGold: true,  isMoving: true,  isShrinking: false, isEvading: false, isGlitchy: false, isDark: false, isBouncy: false, isMagnetic: false, isGhost: true,  speed: 1050 },
            { stage: 13, name: "ظلام وهروب",       required: 20, time: 26, hasBombs: true,  hasGold: true,  isMoving: false, isShrinking: false, isEvading: true,  isGlitchy: false, isDark: true,  isBouncy: false, isMagnetic: false, isGhost: false, speed: 950  },
            { stage: 14, name: "شبح وجاذبية",      required: 22, time: 26, hasBombs: true,  hasGold: true,  isMoving: false, isShrinking: true,  isEvading: false, isGlitchy: true,  isDark: false, isBouncy: true,  isMagnetic: false, isGhost: true,  speed: 800  },
            { stage: 15, name: "الفوضى الكبرى",     required: 26, time: 30, hasBombs: true,  hasGold: true,  isMoving: true,  isShrinking: true,  isEvading: true,  isGlitchy: true,  isDark: false, isBouncy: true,  isMagnetic: true,  isGhost: true,  speed: 650  }
        ];

        // حفظ التقدم والنجوم
        const STORAGE_KEY = 'neon_stages_progress_v1';
        let progress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
            unlockedStage: 1,
            stars: {} // مثال: { 1: 3, 2: 2 }
        };

        function saveProgress() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        }

        // العناصر
        const gameArea = document.getElementById('gameArea');
        const target = document.getElementById('target');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const stageDisplay = document.getElementById('stageDisplay');
        const timeDisplay = document.getElementById('timeDisplay');
        const comboDisplay = document.getElementById('comboDisplay');
        const timeBar = document.getElementById('timeBar');
        const missionCurrent = document.getElementById('missionCurrent');
        const missionRequired = document.getElementById('missionRequired');
        const stageObjective = document.getElementById('stageObjective');
        const levelsGrid = document.getElementById('levelsGrid');
        const clearStarsBox = document.getElementById('clearStarsBox');
        
        // الشاشات والأزرار
        const startScreen = document.getElementById('startScreen');
        const stageSelectScreen = document.getElementById('stageSelectScreen');
        const stageClearScreen = document.getElementById('stageClearScreen');
        const endScreen = document.getElementById('endScreen');
        const endTitle = document.getElementById('endTitle');
        const startBtn = document.getElementById('startBtn');
        const openLevelsBtn = document.getElementById('openLevelsBtn');
        const closeLevelsBtn = document.getElementById('closeLevelsBtn');
        const levelsMenuBtn = document.getElementById('levelsMenuBtn');
        const clearToLevelsBtn = document.getElementById('clearToLevelsBtn');
        const endToLevelsBtn = document.getElementById('endToLevelsBtn');
        const nextStageBtn = document.getElementById('nextStageBtn');
        const restartBtn = document.getElementById('restartBtn');
        const soundBtn = document.getElementById('soundBtn');

        // متغيرات اللعبة
        let currentStageIndex = 0;
        let score = 0;
        let targetsHit = 0;
        let timeLeft = 0;
        let combo = 1;
        let isPlaying = false;
        let isMuted = false;
        
        let gameTimer;
        let targetTimeout;
        let currentTargetType = 'normal';
        let targetX = 0;
        let targetY = 0;

        // الأصوات
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            if (type === 'hit') {
                osc.type = 'sine';
                const pitchBoost = Math.min(combo * 35, 450);
                osc.frequency.setValueAtTime(750 + pitchBoost, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200 + pitchBoost, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else if (type === 'gold') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1650, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
            } else if (type === 'bomb') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            } else if (type === 'stageClear') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(420, audioCtx.currentTime);
                osc.frequency.setValueAtTime(630, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(840, audioCtx.currentTime + 0.2);
                osc.frequency.setValueAtTime(1060, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            }

            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isMuted = !isMuted;
            soundBtn.innerHTML = isMuted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
        });

        // ================= شاشة اختيار المراحل =================
        function renderLevelsGrid() {
            levelsGrid.innerHTML = '';
            stagesConfig.forEach((cfg, idx) => {
                const levelNum = cfg.stage;
                const isUnlocked = levelNum <= progress.unlockedStage;
                const earnedStars = progress.stars[levelNum] || 0;

                const card = document.createElement('div');
                card.className = `level-card ${isUnlocked ? '' : 'locked'}`;

                if (isUnlocked) {
                    let starsHtml = '';
                    for (let s = 1; s <= 3; s++) {
                        starsHtml += `<i class="fas fa-star ${s <= earnedStars ? 'earned' : ''}"></i>`;
                    }
                    card.innerHTML = `
                        <div class="level-num">${levelNum}</div>
                        <div class="level-name">${cfg.name}</div>
                        <div class="level-stars">${starsHtml}</div>
                    `;
                    card.addEventListener('click', () => {
                        startStage(idx);
                    });
                } else {
                    card.innerHTML = `
                        <i class="fas fa-lock lock-icon"></i>
                        <div class="level-name">المرحلة ${levelNum}</div>
                    `;
                }

                levelsGrid.appendChild(card);
            });
        }

        function openStageSelect() {
            stopActiveLoop();
            renderLevelsGrid();
            startScreen.classList.add('hidden');
            stageClearScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            stageSelectScreen.classList.remove('hidden');
        }

        function stopActiveLoop() {
            isPlaying = false;
            clearInterval(gameTimer);
            clearTimeout(targetTimeout);
            target.className = 'target';
            gameArea.classList.remove('dark-mode', 'shake');
        }

        // ================= إدارة اللعبة =================
        function initGame() {
            score = 0;
            startStage(currentStageIndex);
        }

        function startStage(index) {
            currentStageIndex = index;
            const config = stagesConfig[index];
            
            targetsHit = 0;
            timeLeft = config.time;
            combo = 1;
            isPlaying = true;
            
            stageDisplay.textContent = config.stage;
            missionRequired.textContent = config.required;
            missionCurrent.textContent = "0";
            stageObjective.textContent = config.name;
            scoreDisplay.textContent = score;
            comboDisplay.textContent = `x${combo}`;
            
            gameArea.classList.toggle('dark-mode', config.isDark);
            updateUI();
            
            startScreen.classList.add('hidden');
            stageSelectScreen.classList.add('hidden');
            stageClearScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            gameArea.classList.remove('shake');
            target.className = 'target';
            
            clearInterval(gameTimer);
            clearTimeout(targetTimeout);

            gameTimer = setInterval(() => {
                timeLeft--;
                updateUI();
                if (timeLeft <= 0) {
                    gameOver("انتهى الوقت!", false);
                }
            }, 1000);

            spawnTarget();
        }

        function updateUI() {
            timeDisplay.textContent = timeLeft;
            const percent = (timeLeft / stagesConfig[currentStageIndex].time) * 100;
            timeBar.style.width = `${Math.max(0, percent)}%`;
            if (timeLeft <= 5) timeBar.style.background = 'var(--neon-red)';
            else timeBar.style.background = 'var(--neon-pink)';
        }

        function clearTargetEffects() {
            target.classList.remove('active', 'moving', 'shrinking', 'glitchy', 'bouncy', 'ghost');
        }

        // ================= ظهور الأهداف =================
        function spawnTarget() {
            if (!isPlaying) return;
            const config = stagesConfig[currentStageIndex];

            target.className = 'target'; 
            
            const padding = 65;
            const topSafe = 145;
            const maxX = gameArea.clientWidth - padding;
            const maxY = gameArea.clientHeight - padding;
            targetX = Math.floor(Math.random() * (maxX - padding + 1)) + padding;
            targetY = Math.floor(Math.random() * (maxY - topSafe + 1)) + topSafe;

            target.style.left = `${targetX}px`;
            target.style.top = `${targetY}px`;

            currentTargetType = 'normal';
            const roll = Math.random();
            if (config.hasBombs && roll < 0.22) {
                currentTargetType = 'bomb';
            } else if (config.hasGold && roll > 0.84) {
                currentTargetType = 'gold';
            }

            target.classList.add(currentTargetType);

            if (config.isMoving) target.classList.add('moving');
            if (config.isShrinking) target.classList.add('shrinking');
            if (config.isGlitchy) target.classList.add('glitchy');
            if (config.isBouncy) target.classList.add('bouncy');
            if (config.isGhost && currentTargetType !== 'bomb') target.classList.add('ghost');

            requestAnimationFrame(() => target.classList.add('active'));

            clearTimeout(targetTimeout);
            targetTimeout = setTimeout(() => {
                if (isPlaying) {
                    if (currentTargetType !== 'bomb') {
                        combo = 1;
                        comboDisplay.textContent = `x${combo}`;
                    }
                    clearTargetEffects();
                    setTimeout(spawnTarget, 130);
                }
            }, config.speed);
        }

        // حركة الهروب، المغناطيس العكسي، والكشاف
        gameArea.addEventListener('pointermove', (e) => {
            const rect = gameArea.getBoundingClientRect();
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;
            const cfg = stagesConfig[currentStageIndex];

            if (cfg?.isDark) {
                gameArea.style.setProperty('--mx', `${px}px`);
                gameArea.style.setProperty('--my', `${py}px`);
            }

            if (!isPlaying || currentTargetType === 'bomb' || !target.classList.contains('active')) return;

            const dx = targetX - px;
            const dy = targetY - py;
            const dist = Math.hypot(dx, dy);
            const pad = 55;
            const topSafe = 145;

            if (cfg?.isEvading && dist < 90 && dist > 0) {
                const step = 38;
                targetX = Math.min(gameArea.clientWidth - pad, Math.max(pad, targetX + (dx / dist) * step));
                targetY = Math.min(gameArea.clientHeight - pad, Math.max(topSafe, targetY + (dy / dist) * step));
                target.style.left = `${targetX}px`;
                target.style.top = `${targetY}px`;
            } else if (cfg?.isMagnetic && dist < 130 && dist > 10) {
                const pull = 14;
                targetX = Math.min(gameArea.clientWidth - pad, Math.max(pad, targetX - (dx / dist) * pull));
                targetY = Math.min(gameArea.clientHeight - pad, Math.max(topSafe, targetY - (dy / dist) * pull));
                target.style.left = `${targetX}px`;
                target.style.top = `${targetY}px`;
            }
        });

        // ================= النقر =================
        target.addEventListener('pointerdown', (e) => {
            if (!isPlaying) return;
            e.preventDefault();
            e.stopPropagation();
            
            const rect = gameArea.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            if (currentTargetType === 'bomb') {
                timeLeft = Math.max(0, timeLeft - 3);
                combo = 1;
                comboDisplay.textContent = `x${combo}`;
                playSound('bomb');
                gameArea.classList.add('shake');
                setTimeout(() => gameArea.classList.remove('shake'), 400);
                createParticles(clickX, clickY, '#ff0055');
                showFloatingText(clickX, clickY, '-3s', '#ff0055');
                updateUI();
            } else if (currentTargetType === 'gold') {
                const gained = 25 * combo;
                score += gained;
                timeLeft += 1;
                targetsHit++;
                combo++;
                scoreDisplay.textContent = score;
                missionCurrent.textContent = targetsHit;
                comboDisplay.textContent = `x${combo}`;
                playSound('gold');
                createParticles(clickX, clickY, '#ffcc00');
                showFloatingText(clickX, clickY, `+${gained} +1s`, '#ffcc00');
                updateUI();
            } else {
                const gained = 10 * combo;
                score += gained;
                targetsHit++;
                combo++;
                scoreDisplay.textContent = score;
                missionCurrent.textContent = targetsHit;
                comboDisplay.textContent = `x${combo}`;
                playSound('hit');
                createParticles(clickX, clickY, '#00f3ff');
                showFloatingText(clickX, clickY, `+${gained}`, '#00f3ff');
            }

            if (targetsHit >= stagesConfig[currentStageIndex].required) {
                stageClear();
                return;
            }

            clearTargetEffects();
            clearTimeout(targetTimeout);
            
            setTimeout(() => {
                if (isPlaying) spawnTarget();
            }, 50);
        });

        // ================= إنهاء المرحلة وحساب النجوم =================
        function calculateStars() {
            const totalTime = stagesConfig[currentStageIndex].time;
            const ratio = timeLeft / totalTime;
            if (ratio >= 0.45) return 3;
            if (ratio >= 0.18) return 2;
            return 1;
        }

        function stageClear() {
            stopActiveLoop();
            playSound('stageClear');

            const stageNum = stagesConfig[currentStageIndex].stage;
            const starsEarned = calculateStars();
            const prevStars = progress.stars[stageNum] || 0;
            if (starsEarned > prevStars) {
                progress.stars[stageNum] = starsEarned;
            }

            if (stageNum >= progress.unlockedStage && stageNum < stagesConfig.length) {
                progress.unlockedStage = stageNum + 1;
            }
            saveProgress();

            let starsHtml = '';
            for (let i = 1; i <= 3; i++) {
                starsHtml += `<i class="fas fa-star ${i <= starsEarned ? 'earned' : 'empty'}"></i>`;
            }
            clearStarsBox.innerHTML = starsHtml;

            stageClearScreen.classList.remove('hidden');
        }

        function nextStage() {
            if (currentStageIndex + 1 < stagesConfig.length) {
                startStage(currentStageIndex + 1);
            } else {
                gameOver("أنت أسطورة! أكملت جميع المراحل الخمس عشرة!", true);
            }
        }

        function gameOver(msg, isWin) {
            stopActiveLoop();
            
            endTitle.textContent = isWin ? "مبروك الفوز!" : "انتهت اللعبة";
            endTitle.style.color = isWin ? "var(--neon-green)" : "var(--neon-red)";
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalStage').textContent = stagesConfig[currentStageIndex].stage;
            document.getElementById('endMessage').textContent = msg;
            document.getElementById('endMessage').style.color = isWin ? "var(--neon-green)" : "var(--neon-red)";
            
            endScreen.classList.remove('hidden');
        }

        // ================= التأثيرات =================
        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                particle.style.background = color;
                particle.style.boxShadow = `0 0 10px ${color}`;
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 60 + 20;
                particle.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--y', `${Math.sin(angle) * distance}px`);

                gameArea.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }
        }

        function showFloatingText(x, y, text, color) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            gameArea.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        // ================= المستمعات =================
        startBtn.addEventListener('click', () => startStage(0));
        openLevelsBtn.addEventListener('click', openStageSelect);
        closeLevelsBtn.addEventListener('click', () => {
            stageSelectScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });
        levelsMenuBtn.addEventListener('click', openStageSelect);
        clearToLevelsBtn.addEventListener('click', openStageSelect);
        endToLevelsBtn.addEventListener('click', openStageSelect);
        nextStageBtn.addEventListener('click', nextStage);
        restartBtn.addEventListener('click', () => startStage(currentStageIndex));
        
        document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
