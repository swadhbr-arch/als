<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي إكس أو | XO Battle</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg: #0b0e14; --card: #151a26; --primary: #00f3ff; --secondary: #ff0055;
            --success: #00ff66; --gold: #ffcc00; --text-muted: #8892b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; }
        
        body {
            background-color: var(--bg); height: 100vh; height: 100dvh; /* لضمان تغطية الشاشة في الجوال */
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; color: #fff;
        }

        .app-container {
            position: relative; width: 100%; max-width: 500px; height: 100%; 
            background: var(--card); display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* الشاشات */
        .screen { display: none; flex-direction: column; height: 100%; padding: 20px; overflow-y: auto; }
        .screen.active { display: flex; }

        /* ===== شاشة الدخول ===== */
        .dev-banner {
            background: linear-gradient(90deg, rgba(0,243,255,0.1), rgba(255,0,85,0.1));
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center; padding: 10px; font-size: 0.9rem; font-weight: 700;
            color: #fff; letter-spacing: 1px;
        }
        .dev-banner span { color: var(--primary); text-shadow: 0 0 10px rgba(0,243,255,0.5); }
        
        .title { font-size: 2.2rem; text-align: center; margin: 30px 0 10px; color: var(--primary); font-weight: 900; text-shadow: 0 0 15px rgba(0,243,255,0.4);}
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 0.9rem; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: #fff; margin-bottom: 5px; font-weight: 700; font-size: 0.9rem;}
        .input-group input {
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; outline: none; text-align: center;
        }
        .input-group input:focus { border-color: var(--primary); }

        .btn {
            padding: 15px; font-size: 1.1rem; font-weight: 900; color: #000; background: var(--primary);
            border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:hover { background: #fff; transform: scale(1.02); }
        .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); margin-top: 10px; }

        /* ===== شاشة الانتظار ===== */
        .room-code { font-size: 3.5rem; font-weight: 900; color: var(--gold); letter-spacing: 8px; text-align: center; margin: 20px 0; text-shadow: 0 0 20px rgba(255,204,0,0.4); }
        .players-wait { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap;}
        .p-badge { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 20px; font-weight: bold; }

        /* ===== شاشة اللعب (مقسمة) ===== */
        #gameScreen { padding: 10px; gap: 10px; overflow: hidden; } /* منع التمرير هنا */

        /* القسم العلوي: اللعبة */
        .game-section {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            background: rgba(0,0,0,0.2); border-radius: 20px; padding: 10px;
        }

        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 10px;}
        .player-info { display: flex; flex-direction: column; align-items: center; }
        .player-name { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
        .player-symbol { font-size: 1.3rem; font-weight: 900; }
        .sym-x { color: var(--primary); }
        .sym-o { color: var(--secondary); }
        .turn-indicator { font-size: 0.9rem; font-weight: 900; color: var(--gold); background: rgba(255,204,0,0.1); padding: 5px 12px; border-radius: 20px;}

        /* لوحة إكس أو */
        .board {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            width: 100%; max-height: 45vh; aspect-ratio: 1/1; margin: 0 auto;
            background: rgba(0,0,0,0.3); padding: 8px; border-radius: 15px;
        }
        .cell {
            background: #1e2536; border-radius: 10px; display: flex; justify-content: center; align-items: center;
            font-size: 3rem; font-weight: 900; cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.05);
        }
        .cell:hover { background: #2a334a; }
        .cell.x { color: var(--primary); text-shadow: 0 0 15px rgba(0,243,255,0.5); }
        .cell.o { color: var(--secondary); text-shadow: 0 0 15px rgba(255,0,85,0.5); }
        .cell.win { background: rgba(0, 255, 102, 0.2); border-color: var(--success); animation: pulseWin 0.5s infinite alternate; }
        @keyframes pulseWin { from { transform: scale(1); } to { transform: scale(1.05); } }

        /* أزرار التحكم */
        .controls { display: flex; gap: 10px; margin-top: 10px; }
        .controls .btn { padding: 10px; font-size: 0.9rem; border-radius: 10px;}

        /* ===== القسم السفلي: الدردشة (ظاهرة دائماً) ===== */
        .chat-section {
            flex: 1; /* تأخذ باقي المساحة */
            display: flex; flex-direction: column;
            background: #0f131c; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .chat-header { padding: 10px 15px; background: rgba(255,255,255,0.03); display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.05);}
        
        .chat-messages { 
            flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; 
        }
        /* تخصيص شريط التمرير للدردشة */
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .msg { padding: 8px 12px; border-radius: 12px; max-width: 85%; font-size: 0.85rem; line-height: 1.4; word-wrap: break-word; }
        .msg.me { background: var(--primary); color: #000; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.other { background: #232a3b; color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-name { font-size: 0.65rem; opacity: 0.7; margin-bottom: 2px; display: block; font-weight: bold;}
        
        .chat-input-area { padding: 10px; display: flex; gap: 8px; background: #000; border-top: 1px solid rgba(255,255,255,0.05); }
        .chat-input-area input { flex: 1; padding: 10px 15px; border-radius: 20px; border: none; background: #1a1f2b; color: #fff; outline: none; font-size: 0.9rem;}
        .chat-input-area button { background: var(--primary); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1rem; color: #000; display: flex; justify-content: center; align-items: center;}

        /* شاشة الفائز */
        .winner-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .winner-overlay.show { opacity: 1; pointer-events: auto; }
        .winner-text { font-size: 2.5rem; font-weight: 900; margin-bottom: 20px; text-align: center;}
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- اسم المطور (شريط علوي ثابت) -->
        <div class="dev-banner">
            تطوير المبدع: <span>عبدالرحيم الجياشي الشمري</span>
        </div>

        <!-- 1. شاشة الدخول -->
        <div class="screen active" id="authScreen">
            <div class="title">تحدي إكس أو ❌⭕</div>
            <div class="subtitle">تحدى صديقك في لعبة الذكاء الكلاسيكية والدردشة معه!</div>
            
            <div class="input-group">
                <label>اسمك:</label>
                <input type="text" id="playerName" placeholder="اكتب اسمك هنا...">
            </div>
            
            <button class="btn" id="createRoomBtn"><i class="fas fa-plus"></i> إنشاء غرفة جديدة</button>
            
            <div style="text-align: center; margin: 15px 0; color: #555; font-weight:bold;">- أو -</div>
            
            <div class="input-group">
                <label>كود الغرفة (للدخول لصديقك):</label>
                <input type="text" id="roomCodeInput" placeholder="مثال: A7B2" style="text-transform: uppercase;">
            </div>
            <button class="btn btn-outline" id="joinRoomBtn"><i class="fas fa-sign-in-alt"></i> دخول الغرفة</button>
        </div>

        <!-- 2. شاشة الانتظار (Lobby) -->
        <div class="screen" id="lobbyScreen">
            <h2 style="text-align: center; color: #fff; margin-top: 20px;">غرفة الانتظار</h2>
            <p style="text-align: center; color: var(--text-muted);">شارك هذا الكود مع صديقك:</p>
            <div class="room-code" id="displayRoomCode">----</div>
            
            <div class="players-wait" id="playersList"></div>

            <p id="waitMsg" style="text-align: center; color: var(--primary); font-weight: bold; margin-top: 20px;">بانتظار انضمام صديقك...</p>
        </div>

        <!-- 3. شاشة اللعب (تنقسم للعبة والدردشة) -->
        <div class="screen" id="gameScreen">
            
            <!-- القسم العلوي: اللعبة -->
            <div class="game-section">
                <div class="game-header">
                    <div class="player-info">
                        <span class="player-name" id="opNameDisplay">الخصم</span>
                        <span class="player-symbol sym-o" id="opSymbolDisplay">O</span>
                    </div>
                    <div class="turn-indicator" id="turnDisplay">جاري التحميل...</div>
                    <div class="player-info">
                        <span class="player-name" id="myNameDisplay">أنت</span>
                        <span class="player-symbol sym-x" id="mySymbolDisplay">X</span>
                    </div>
                </div>

                <div class="board" id="board">
                    <div class="cell" data-index="0"></div>
                    <div class="cell" data-index="1"></div>
                    <div class="cell" data-index="2"></div>
                    <div class="cell" data-index="3"></div>
                    <div class="cell" data-index="4"></div>
                    <div class="cell" data-index="5"></div>
                    <div class="cell" data-index="6"></div>
                    <div class="cell" data-index="7"></div>
                    <div class="cell" data-index="8"></div>
                </div>

                <div class="controls">
                    <button class="btn" id="nextRoundBtn" style="display: none;"><i class="fas fa-redo"></i> جولة جديدة</button>
                    <button class="btn" id="restartBtn" style="background: transparent; border: 1px solid #555; color: #aaa;"><i class="fas fa-door-open"></i> خروج</button>
                </div>
            </div>

            <!-- القسم السفلي: الدردشة (ظاهرة دائماً) -->
            <div class="chat-section">
                <div class="chat-header">
                    <span><i class="fas fa-comments" style="color:var(--primary)"></i> الدردشة المباشرة</span>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="اكتب رسالة...">
                    <button id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- شاشة الفائز -->
            <div class="winner-overlay" id="winnerOverlay">
                <div class="winner-text" id="winnerText">لقد فزت! 🏆</div>
                <button class="btn" id="closeOverlayBtn" style="width: 200px;">استمرار</button>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // 1. إعدادات Firebase (خاصة بك)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQa9TnbuCCPqfnXY-T9t-uwag0J2WEnFI",
            authDomain: "arrahimm.firebaseapp.com",
            databaseURL: "https://arrahimm-default-rtdb.firebaseio.com/",
            projectId: "arrahimm",
            storageBucket: "arrahimm.firebasestorage.app",
            messagingSenderId: "150237867312",
            appId: "1:150237867312:web:364d67877f9ff4d2bbacf5"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // ==========================================
        // 2. المتغيرات
        // ==========================================
        let myId = 'player_' + Math.floor(Math.random() * 10000);
        let myName = "";
        let currentRoom = "";
        let isHost = false;
        let roomData = {};
        let mySymbol = ""; 
        let isMyTurn = false;
        let lastMessageCount = 0;

        // العناصر
        const authScreen = document.getElementById('authScreen');
        const lobbyScreen = document.getElementById('lobbyScreen');
        const gameScreen = document.getElementById('gameScreen');
        const winnerOverlay = document.getElementById('winnerOverlay');

        // ==========================================
        // 3. إنشاء ودخول الغرف
        // ==========================================
        document.getElementById('createRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            isHost = true;
            currentRoom = code;
            
            db.ref('rooms/' + code).set({
                host: myId,
                status: 'waiting',
                players: { [myId]: { name: myName, symbol: 'X' } },
                board: ["", "", "", "", "", "", "", "", ""],
                turn: 'X',
                winner: null
            }).then(() => enterLobby());
        });

        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            if (!code) return alert("الرجاء كتابة كود الغرفة");

            isHost = false;
            currentRoom = code;
            
            db.ref('rooms/' + code).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    db.ref(`rooms/${code}/players/${myId}`).set({ name: myName, symbol: 'O' });
                    enterLobby();
                } else {
                    alert("الغرفة غير موجودة، تأكد من الكود.");
                }
            });
        });

        function enterLobby() {
            authScreen.classList.remove('active');
            lobbyScreen.classList.add('active');
            document.getElementById('displayRoomCode').textContent = currentRoom;
            listenToRoom();
        }

        // ==========================================
        // 4. الاستماع لتحديثات الغرفة
        // ==========================================
        function listenToRoom() {
            db.ref('rooms/' + currentRoom).on('value', (snapshot) => {
                roomData = snapshot.val();
                if (!roomData) return;

                const playersList = document.getElementById('playersList');
                playersList.innerHTML = '';
                let playerCount = 0;

                for (let pid in roomData.players) {
                    playerCount++;
                    const p = roomData.players[pid];
                    playersList.innerHTML += `<div class="p-badge">${p.name} (${p.symbol})</div>`;
                    
                    if (pid === myId) {
                        mySymbol = p.symbol;
                        document.getElementById('myNameDisplay').textContent = p.name;
                        document.getElementById('mySymbolDisplay').textContent = p.symbol;
                        document.getElementById('mySymbolDisplay').className = `player-symbol ${p.symbol === 'X' ? 'sym-x' : 'sym-o'}`;
                    } else {
                        document.getElementById('opNameDisplay').textContent = p.name;
                        document.getElementById('opSymbolDisplay').textContent = p.symbol;
                        document.getElementById('opSymbolDisplay').className = `player-symbol ${p.symbol === 'X' ? 'sym-x' : 'sym-o'}`;
                    }
                }

                // الانتقال للعبة بمجرد دخول شخصين
                if (playerCount === 2 && !gameScreen.classList.contains('active')) {
                    lobbyScreen.classList.remove('active');
                    gameScreen.classList.add('active');
                    // إخفاء زر الجولة الجديدة حتى تنتهي الجولة الحالية
                    document.getElementById('nextRoundBtn').style.display = 'none';
                }

                if (gameScreen.classList.contains('active')) {
                    updateBoardUI();
                    checkGameState();
                }
                
                renderChat();
            });
        }

        // ==========================================
        // 5. منطق لعبة إكس أو
        // ==========================================
        document.querySelectorAll('.cell').forEach(cell => {
            cell.addEventListener('click', () => {
                const index = cell.getAttribute('data-index');
                if (roomData.winner || roomData.turn !== mySymbol || roomData.board[index] !== "") return;

                const updates = {};
                updates[`rooms/${currentRoom}/board/${index}`] = mySymbol;
                updates[`rooms/${currentRoom}/turn`] = mySymbol === 'X' ? 'O' : 'X';
                db.ref().update(updates);
            });
        });

        function updateBoardUI() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, index) => {
                const val = roomData.board[index];
                cell.textContent = val;
                cell.className = 'cell'; 
                if (val === 'X') cell.classList.add('x');
                if (val === 'O') cell.classList.add('o');
            });

            if (!roomData.winner) {
                isMyTurn = (roomData.turn === mySymbol);
                const turnDisplay = document.getElementById('turnDisplay');
                if (isMyTurn) {
                    turnDisplay.textContent = "دورك الآن!";
                    turnDisplay.style.color = "var(--success)";
                } else {
                    turnDisplay.textContent = "دور الخصم...";
                    turnDisplay.style.color = "var(--text-muted)";
                }
            }
        }

        function checkGameState() {
            const b = roomData.board;
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];

            let winnerSymbol = null;
            let winPattern = null;

            for (let pattern of winPatterns) {
                const [a, b1, c] = pattern;
                if (b[a] && b[a] === b[b1] && b[a] === b[c]) {
                    winnerSymbol = b[a];
                    winPattern = pattern;
                    break;
                }
            }

            if (winnerSymbol && !roomData.winner) {
                db.ref(`rooms/${currentRoom}/winner`).set(winnerSymbol);
            }

            if (!winnerSymbol && !roomData.board.includes("") && !roomData.winner) {
                db.ref(`rooms/${currentRoom}/winner`).set("draw");
            }

            if (roomData.winner) {
                document.getElementById('turnDisplay').textContent = "انتهت اللعبة";
                document.getElementById('turnDisplay').style.color = "var(--gold)";
                
                if (winPattern) {
                    winPattern.forEach(idx => {
                        document.querySelectorAll('.cell')[idx].classList.add('win');
                    });
                }

                if (!winnerOverlay.classList.contains('show')) {
                    let text = "";
                    if (roomData.winner === 'draw') text = "تعادل! 🤝";
                    else if (roomData.winner === mySymbol) text = "لقد فزت! 🏆";
                    else text = "للأسف، لقد خسرت! 💀";
                    
                    document.getElementById('winnerText').textContent = text;
                    winnerOverlay.classList.add('show');
                    
                    // إظهار زر الجولة الجديدة (يمكن لأي شخص الضغط عليه)
                    document.getElementById('nextRoundBtn').style.display = 'flex';
                }
            }
        }

        document.getElementById('closeOverlayBtn').addEventListener('click', () => {
            winnerOverlay.classList.remove('show');
        });

        document.getElementById('nextRoundBtn').addEventListener('click', () => {
            // تصفير اللوحة
            db.ref('rooms/' + currentRoom).update({
                board: ["", "", "", "", "", "", "", "", ""],
                turn: 'X',
                winner: null
            });
            winnerOverlay.classList.remove('show');
            document.getElementById('nextRoundBtn').style.display = 'none';
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            if(confirm("هل تريد الخروج من الغرفة؟")) {
                window.location.reload();
            }
        });

        // ==========================================
        // 6. الدردشة (ثابتة وتعمل فوراً)
        // ==========================================
        document.getElementById('sendChatBtn').addEventListener('click', sendMessage);
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            
            db.ref('rooms/' + currentRoom + '/messages').push({
                sender: myName,
                text: text,
                time: Date.now()
            });
            input.value = '';
        }

        function renderChat() {
            const chatContainer = document.getElementById('chatMessages');
            
            if (roomData.messages) {
                const msgs = Object.values(roomData.messages).sort((a, b) => a.time - b.time);
                
                if (msgs.length !== lastMessageCount) {
                    lastMessageCount = msgs.length;
                    let html = '';
                    
                    msgs.forEach(msg => {
                        const isMe = msg.sender === myName;
                        html += `
                            <div class="msg ${isMe ? 'me' : 'other'}">
                                <span class="msg-name">${msg.sender}</span>
                                ${msg.text}
                            </div>
                        `;
                    });
                    
                    chatContainer.innerHTML = html;
                    // التمرير التلقائي للأسفل
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            }
        }
    </script>
</body>
</html>
