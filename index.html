<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مبارزة الأعصاب | Reaction Duel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg: #0f1015; --card: #1a1c29; --primary: #00f3ff;
            --danger: #ff0055; --success: #00ff66; --gold: #ffcc00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; }
        
        body {
            background-color: var(--bg); height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; color: #fff;
        }

        .app-container {
            position: relative; width: 100%; max-width: 500px; height: 100vh; max-height: 900px;
            background: var(--card); display: flex; flex-direction: column; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* الشاشات */
        .screen { display: none; flex-direction: column; height: 100%; padding: 20px; overflow-y: auto; }
        .screen.active { display: flex; }

        /* شاشة الدخول */
        .title { font-size: 2rem; text-align: center; margin: 40px 0 10px; color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; font-size: 0.9rem; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: var(--primary); margin-bottom: 5px; font-weight: 700; }
        .input-group input {
            width: 100%; padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; outline: none;
        }
        .input-group input:focus { border-color: var(--primary); }

        .btn {
            padding: 15px; font-size: 1.1rem; font-weight: 900; color: #000; background: var(--primary);
            border: none; border-radius: 50px; cursor: pointer; transition: 0.2s; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:hover { background: #fff; transform: scale(1.02); }
        .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); margin-top: 10px; }

        /* شاشة الانتظار */
        .room-code { font-size: 3rem; font-weight: 900; color: var(--gold); letter-spacing: 5px; text-align: center; margin: 20px 0; text-shadow: 0 0 20px rgba(255,204,0,0.5); }
        .players-wait { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .p-badge { background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 20px; font-weight: bold; }

        /* شاشة اللعب */
        .score-board { display: flex; justify-content: space-between; padding: 10px 20px; background: rgba(0,0,0,0.5); border-radius: 15px; margin-bottom: 20px; font-weight: 900; font-size: 1.2rem; }
        .my-score { color: var(--primary); }
        .op-score { color: var(--danger); }

        .game-area {
            flex: 1; border-radius: 20px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: background 0.1s;
            cursor: pointer; text-align: center; padding: 20px;
        }

        .game-area.red { background: var(--danger); box-shadow: inset 0 0 50px rgba(0,0,0,0.5); }
        .game-area.green { background: var(--success); box-shadow: inset 0 0 50px rgba(0,0,0,0.5); color: #000; }
        .game-area.waiting { background: #222; color: #888; }
        .game-area.winner { background: var(--gold); color: #000; }

        .game-text { font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; }
        .game-sub { font-size: 1.2rem; font-weight: 700; }

        /* الدردشة */
        .chat-toggle {
            position: absolute; bottom: 20px; left: 20px; width: 50px; height: 50px;
            background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: #000; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 100;
        }
        .chat-box {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60%; background: #111;
            border-top-left-radius: 20px; border-top-right-radius: 20px; display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.3s; z-index: 99; border-top: 2px solid var(--primary);
        }
        .chat-box.open { transform: translateY(0); }
        .chat-header { padding: 15px; background: rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; font-weight: 900;}
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 10px; max-width: 80%; font-size: 0.9rem; }
        .msg.me { background: var(--primary); color: #000; align-self: flex-end; border-bottom-right-radius: 0; }
        .msg.other { background: rgba(255,255,255,0.1); color: #fff; align-self: flex-start; border-bottom-left-radius: 0; }
        .msg-name { font-size: 0.7rem; opacity: 0.7; margin-bottom: 3px; display: block; }
        .chat-input-area { padding: 10px; display: flex; gap: 10px; background: #000; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 20px; border: none; background: #222; color: #fff; outline: none; }
        .chat-input-area button { background: var(--primary); border: none; width: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }

        /* زر بدء الجولة (للمضيف) */
        #hostStartBtn { margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 1. شاشة الدخول -->
        <div class="screen active" id="authScreen">
            <div class="title">مبارزة الأعصاب 🧠</div>
            <div class="subtitle">لعبة سريعة وممتعة، العبها مع صديقك واختبروا سرعة بديهتكم!</div>
            
            <div class="input-group">
                <label>اسمك:</label>
                <input type="text" id="playerName" placeholder="اكتب اسمك هنا...">
            </div>
            
            <button class="btn" id="createRoomBtn"><i class="fas fa-plus"></i> إنشاء غرفة جديدة</button>
            
            <div style="text-align: center; margin: 15px 0; color: #555;">- أو -</div>
            
            <div class="input-group">
                <label>كود الغرفة (للدخول لصديقك):</label>
                <input type="text" id="roomCodeInput" placeholder="مثال: A7B2" style="text-transform: uppercase;">
            </div>
            <button class="btn btn-outline" id="joinRoomBtn"><i class="fas fa-sign-in-alt"></i> دخول الغرفة</button>
        </div>

        <!-- 2. شاشة الانتظار (Lobby) -->
        <div class="screen" id="lobbyScreen">
            <h2 style="text-align: center; color: #fff; margin-top: 20px;">غرفة الانتظار</h2>
            <p style="text-align: center; color: #aaa;">شارك هذا الكود مع صديقك:</p>
            <div class="room-code" id="displayRoomCode">----</div>
            
            <div class="players-wait" id="playersList"></div>

            <p id="waitMsg" style="text-align: center; color: var(--primary); font-weight: bold; margin-top: 20px;">بانتظار انضمام صديقك...</p>
            
            <button class="btn" id="hostStartBtn" style="background: var(--success);"><i class="fas fa-play"></i> ابدأ المبارزة!</button>
        </div>

        <!-- 3. شاشة اللعب -->
        <div class="screen" id="gameScreen">
            <div class="score-board">
                <div class="my-score" id="myScoreDisplay">أنت: 0</div>
                <div class="op-score" id="opponentScoreDisplay">الخصم: 0</div>
            </div>
            
            <div class="game-area waiting" id="gameArea">
                <div class="game-text" id="gameText">استعد...</div>
                <div class="game-sub" id="gameSub">انتظر المضيف ليبدأ الجولة</div>
            </div>

            <button class="btn" id="nextRoundBtn" style="background: var(--gold); display: none; margin-top: 15px;"><i class="fas fa-redo"></i> الجولة التالية</button>
        </div>

        <!-- الدردشة -->
        <div class="chat-toggle" id="chatToggle" style="display: none;"><i class="fas fa-comment-dots"></i></div>
        <div class="chat-box" id="chatBox">
            <div class="chat-header">
                <span>الدردشة 💬</span>
                <i class="fas fa-times" id="closeChat" style="cursor: pointer;"></i>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="اكتب رسالة...">
                <button id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // إعدادات Firebase الخاصة بك
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBQa9TnbuCCPqfnXY-T9t-uwag0J2WEnFI",
            authDomain: "arrahimm.firebaseapp.com",
            databaseURL: "https://arrahimm-default-rtdb.firebaseio.com/",
            projectId: "arrahimm",
            storageBucket: "arrahimm.firebasestorage.app",
            messagingSenderId: "150237867312",
            appId: "1:150237867312:web:364d67877f9ff4d2bbacf5"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // ==========================================
        // المتغيرات
        // ==========================================
        let myId = 'player_' + Math.floor(Math.random() * 10000);
        let myName = "";
        let currentRoom = "";
        let isHost = false;
        let roomData = {};
        let hasClickedThisRound = false;

        // العناصر
        const authScreen = document.getElementById('authScreen');
        const lobbyScreen = document.getElementById('lobbyScreen');
        const gameScreen = document.getElementById('gameScreen');
        const chatToggle = document.getElementById('chatToggle');
        const chatBox = document.getElementById('chatBox');

        // ==========================================
        // إنشاء ودخول الغرف
        // ==========================================
        document.getElementById('createRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            isHost = true;
            currentRoom = code;
            
            db.ref('rooms/' + code).set({
                host: myId,
                status: 'waiting',
                players: {
                    [myId]: { name: myName, score: 0 }
                }
            }).then(() => enterLobby());
        });

        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            myName = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!myName) return alert("الرجاء كتابة اسمك أولاً");
            if (!code) return alert("الرجاء كتابة كود الغرفة");

            isHost = false;
            currentRoom = code;
            
            db.ref('rooms/' + code).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    db.ref(`rooms/${code}/players/${myId}`).set({ name: myName, score: 0 });
                    enterLobby();
                } else {
                    alert("الغرفة غير موجودة، تأكد من الكود.");
                }
            });
        });

        function enterLobby() {
            authScreen.classList.remove('active');
            lobbyScreen.classList.add('active');
            chatToggle.style.display = 'flex';
            document.getElementById('displayRoomCode').textContent = currentRoom;
            listenToRoom();
        }

        // ==========================================
        // الاستماع لتحديثات الغرفة
        // ==========================================
        function listenToRoom() {
            db.ref('rooms/' + currentRoom).on('value', (snapshot) => {
                roomData = snapshot.val();
                if (!roomData) return;

                // تحديث اللاعبين
                const playersList = document.getElementById('playersList');
                playersList.innerHTML = '';
                let playerCount = 0;

                for (let pid in roomData.players) {
                    playerCount++;
                    const p = roomData.players[pid];
                    playersList.innerHTML += `<div class="p-badge">${p.name} ${pid === roomData.host ? '👑' : ''}</div>`;
                    
                    if (pid === myId) document.getElementById('myScoreDisplay').textContent = `أنت: ${p.score}`;
                    else document.getElementById('opponentScoreDisplay').textContent = `${p.name}: ${p.score}`;
                }

                // الانتقال لشاشة اللعب
                if (roomData.status === 'playing' && !gameScreen.classList.contains('active')) {
                    lobbyScreen.classList.remove('active');
                    gameScreen.classList.add('active');
                }

                // إظهار زر البدء للمضيف (تم إصلاح هذا الجزء)
                if (playerCount === 2 && isHost) {
                    if (roomData.status === 'waiting' || roomData.gameState === 'idle') {
                        document.getElementById('hostStartBtn').style.display = 'block';
                        document.getElementById('waitMsg').style.display = 'none';
                    } else {
                        document.getElementById('hostStartBtn').style.display = 'none';
                    }
                } else if (playerCount < 2 && isHost) {
                    document.getElementById('hostStartBtn').style.display = 'none';
                    document.getElementById('waitMsg').style.display = 'block';
                }

                // تحديث واجهة اللعبة
                if (roomData.status === 'playing') {
                    updateGameUI();
                }
                
                renderChat();
            });
        }

        // ==========================================
        // منطق اللعبة (مبارزة الأعصاب)
        // ==========================================
        document.getElementById('hostStartBtn').addEventListener('click', () => {
            const delay = Math.floor(Math.random() * 3000) + 2000; // بين 2 إلى 5 ثواني
            
            // هنا كان الخطأ، قمنا بإضافة status: 'playing'
            db.ref('rooms/' + currentRoom).update({
                status: 'playing', 
                gameState: 'red',
                startTime: Date.now(),
                greenDelay: delay,
                winner: null,
                foulPlayer: null
            });
            document.getElementById('hostStartBtn').style.display = 'none';

            // تحويل الشاشة للأخضر بعد الوقت العشوائي
            setTimeout(() => {
                db.ref('rooms/' + currentRoom).once('value').then(snap => {
                    if (snap.val().gameState === 'red') {
                        db.ref('rooms/' + currentRoom).update({ gameState: 'green' });
                    }
                });
            }, delay);
        });

        const gameArea = document.getElementById('gameArea');
        gameArea.addEventListener('click', () => {
            if (roomData.status !== 'playing' || roomData.gameState === 'idle' || roomData.winner || roomData.foulPlayer) return;
            if (hasClickedThisRound) return;

            if (roomData.gameState === 'red') {
                // ضغط وهو أحمر (استعجل)
                db.ref('rooms/' + currentRoom).update({ foulPlayer: myId });
                hasClickedThisRound = true;
            } else if (roomData.gameState === 'green') {
                // ضغط وهو أخضر (فاز)
                db.ref('rooms/' + currentRoom).update({ winner: myId });
                hasClickedThisRound = true;
            }
        });

        function updateGameUI() {
            const text = document.getElementById('gameText');
            const sub = document.getElementById('gameSub');
            
            gameArea.className = 'game-area'; // تصفير الكلاسات

            if (roomData.gameState === 'idle') {
                gameArea.classList.add('waiting');
                text.textContent = "استعد...";
                sub.textContent = isHost ? "اضغط على 'الجولة التالية' للبدء" : "انتظر المضيف ليبدأ";
                document.getElementById('nextRoundBtn').style.display = isHost ? 'block' : 'none';
                hasClickedThisRound = false;

            } else if (roomData.gameState === 'red') {
                gameArea.classList.add('red');
                text.textContent = "انتظر...";
                sub.textContent = "ممنوع الضغط! ⛔";
                document.getElementById('nextRoundBtn').style.display = 'none';

            } else if (roomData.gameState === 'green') {
                gameArea.classList.add('green');
                text.textContent = "اضغط الآن!!!";
                sub.textContent = "بأسرع ما يمكنك! ⚡";

            } else if (roomData.winner || roomData.foulPlayer) {
                // انتهت الجولة
                hasClickedThisRound = true;
                document.getElementById('nextRoundBtn').style.display = isHost ? 'block' : 'none';

                if (roomData.winner) {
                    gameArea.classList.add('winner');
                    if (roomData.winner === myId) {
                        text.textContent = "لقد فزت! 🏆";
                        sub.textContent = "أعصابك فولاذية!";
                        updateScore(myId);
                    } else {
                        text.textContent = "لقد خسرت! 💀";
                        sub.textContent = `${roomData.players[roomData.winner].name} كان أسرع منك!`;
                        updateScore(roomData.winner);
                    }
                } else if (roomData.foulPlayer) {
                    gameArea.classList.add('red');
                    if (roomData.foulPlayer === myId) {
                        text.textContent = "لقد استعجلت! 🤡";
                        sub.textContent = "ضغطت واللون أحمر!";
                        const otherPid = Object.keys(roomData.players).find(id => id !== myId);
                        updateScore(otherPid);
                    } else {
                        text.textContent = "لقد فزت بالجولة! 🎉";
                        sub.textContent = `${roomData.players[roomData.foulPlayer].name} استعجل وضغط!`;
                        updateScore(myId);
                    }
                }
            }
        }

        let scoreUpdatedThisRound = false;
        function updateScore(winnerId) {
            if (scoreUpdatedThisRound) return;
            scoreUpdatedThisRound = true;
            
            const currentScore = roomData.players[winnerId].score || 0;
            db.ref(`rooms/${currentRoom}/players/${winnerId}/score`).set(currentScore + 1);
            
            setTimeout(() => scoreUpdatedThisRound = false, 1000);
        }

        document.getElementById('nextRoundBtn').addEventListener('click', () => {
            db.ref('rooms/' + currentRoom).update({
                gameState: 'idle',
                winner: null,
                foulPlayer: null
            });
            document.getElementById('nextRoundBtn').style.display = 'none';
        });

        // ==========================================
        // الدردشة
        // ==========================================
        chatToggle.addEventListener('click', () => chatBox.classList.add('open'));
        document.getElementById('closeChat').addEventListener('click', () => chatBox.classList.remove('open'));

        document.getElementById('sendChatBtn').addEventListener('click', sendMessage);
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            
            db.ref('rooms/' + currentRoom + '/messages').push({
                sender: myName,
                text: text
            });
            input.value = '';
        }

        function renderChat() {
            const chatContainer = document.getElementById('chatMessages');
            if (roomData.messages) {
                let html = '';
                for (let key in roomData.messages) {
                    const msg = roomData.messages[key];
                    const isMe = msg.sender === myName;
                    html += `
                        <div class="msg ${isMe ? 'me' : 'other'}">
                            <span class="msg-name">${msg.sender}</span>
                            ${msg.text}
                        </div>
                    `;
                }
                if(chatContainer.innerHTML !== html) {
                    chatContainer.innerHTML = html;
                    chatContainer.scrollTop = chatContainer.scrollHeight; 
                }
            }
        }
    </script>
</body>
</html>
