<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Reflex | تحدي سرعة البديهة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --bg-color: #050510;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            user-select: none; /* منع تحديد النص أثناء اللعب */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at center, rgba(0, 243, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at bottom, rgba(255, 0, 234, 0.05) 0%, transparent 50%);
        }

        /* حاوية اللعبة */
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 90vh;
            max-height: 700px;
            background: rgba(10, 15, 30, 0.8);
            border: 2px solid rgba(0, 243, 255, 0.3);
            border-radius: 1.5rem;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 243, 255, 0.1);
            overflow: hidden;
            cursor: crosshair;
        }

        /* شريط المعلومات العلوي (HUD) */
        .hud {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            padding: 1.5rem;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(5,5,16,0.9), transparent);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .time-value { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }

        /* الهدف (الدائرة) */
        .target {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 10px #fff;
            transform: translate(-50%, -50%) scale(0);
            cursor: pointer;
            z-index: 5;
            display: none;
        }

        /* تأثير ظهور الهدف */
        .target.active {
            display: block;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            to { transform: translate(-50%, -50%) scale(1); }
        }

        /* تأثير الانفجار عند النقر */
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
            pointer-events: none;
            z-index: 4;
            transform: translate(-50%, -50%);
            animation: explode 0.5s ease-out forwards;
        }

        @keyframes explode {
            to {
                transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0);
                opacity: 0;
            }
        }

        /* شاشة البداية والنهاية */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 16, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 2rem;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .game-title span { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }

        .game-desc {
            font-size: 1rem;
            color: #a0aabf;
            margin-bottom: 2rem;
            max-width: 80%;
            line-height: 1.6;
        }

        .btn {
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: #000;
            background: var(--neon-blue);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--neon-blue);
            transition: all 0.2s;
            font-family: 'Tajawal', sans-serif;
        }

        .btn:hover {
            background: #fff;
            box-shadow: 0 0 30px #fff, 0 0 10px var(--neon-blue);
            transform: scale(1.05);
        }

        /* شاشة النتيجة */
        .final-score {
            font-size: 4rem;
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 20px var(--neon-blue);
            margin: 1rem 0;
        }

        .high-score-text {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
        }

    </style>
</head>
<body>

    <div class="game-wrapper" id="gameArea">
        
        <!-- شريط النقاط والوقت -->
        <div class="hud">
            <div class="stat-box">
                <span class="stat-label">Score</span>
                <span class="stat-value" id="scoreDisplay">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Time</span>
                <span class="stat-value time-value" id="timeDisplay">30</span>
            </div>
        </div>

        <!-- الهدف -->
        <div class="target" id="target"></div>

        <!-- شاشة البداية / النهاية -->
        <div class="overlay" id="startScreen">
            <h1 class="game-title">NEON <span>REFLEX</span></h1>
            <p class="game-desc">انقر على الدوائر المتوهجة بأسرع ما يمكن قبل أن تختفي. لديك 30 ثانية لإثبات سرعة بديهتك!</p>
            
            <div class="high-score-text">أعلى نتيجة: <span id="highScoreDisplay">0</span></div>
            
            <button class="btn" id="startBtn">ابدأ اللعب</button>
        </div>

        <div class="overlay hidden" id="endScreen">
            <h1 class="game-title">انتهى الوقت!</h1>
            <div class="final-score" id="finalScore">0</div>
            <p class="game-desc">نقاطك النهائية</p>
            
            <div class="high-score-text" id="endHighScoreMsg">أعلى نتيجة: 0</div>
            
            <button class="btn" id="restartBtn">إعادة المحاولة</button>
        </div>

    </div>

    <script>
        // إعدادات اللعبة
        const GAME_TIME = 30; // مدة اللعبة بالثواني
        const TARGET_LIFESPAN = 800; // مدة بقاء الهدف بالمللي ثانية (0.8 ثانية)

        // العناصر
        const gameArea = document.getElementById('gameArea');
        const target = document.getElementById('target');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timeDisplay = document.getElementById('timeDisplay');
        const startScreen = document.getElementById('startScreen');
        const endScreen = document.getElementById('endScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const finalScore = document.getElementById('finalScore');
        const endHighScoreMsg = document.getElementById('endHighScoreMsg');

        // المتغيرات
        let score = 0;
        let timeLeft = GAME_TIME;
        let gameActive = false;
        let gameInterval;
        let targetTimeout;
        
        // جلب أعلى نتيجة من الذاكرة
        let highScore = localStorage.getItem('neonReflexHighScore') || 0;
        highScoreDisplay.textContent = highScore;

        // الأصوات (Web Audio API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playHitSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playMissSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        // دالة بدء اللعبة
        function startGame() {
            score = 0;
            timeLeft = GAME_TIME;
            gameActive = true;
            
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            
            // مسح أي مؤقتات سابقة
            clearInterval(gameInterval);
            clearTimeout(targetTimeout);
            target.classList.remove('active');
            
            // مؤقت الوقت
            gameInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // إظهار أول هدف
            moveTarget();
        }

        // دالة إظهار الهدف في مكان عشوائي
        function moveTarget() {
            if (!gameActive) return;

            // إخفاء الهدف مؤقتاً لإعادة وضعه
            target.classList.remove('active');
            
            // حساب مساحة اللعب (مع ترك مسافة للحواف)
            const padding = 40;
            const maxX = gameArea.clientWidth - padding;
            const maxY = gameArea.clientHeight - padding;
            
            const randomX = Math.floor(Math.random() * (maxX - padding + 1)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding + 1)) + padding;

            target.style.left = `${randomX}px`;
            target.style.top = `${randomY}px`;

            // إظهار الهدف
            // استخدام requestAnimationFrame لضمان عمل الأنيميشن
            requestAnimationFrame(() => {
                target.classList.add('active');
            });

            // مؤقت اختفاء الهدف (إذا لم ينقر عليه اللاعب)
            clearTimeout(targetTimeout);
            targetTimeout = setTimeout(() => {
                if (gameActive) {
                    playMissSound();
                    target.classList.remove('active');
                    // إظهار هدف جديد بعد فترة قصيرة جداً
                    setTimeout(moveTarget, 200);
                }
            }, TARGET_LIFESPAN);
        }

        // عند النقر على الهدف
        target.addEventListener('pointerdown', (e) => {
            if (!gameActive) return;
            
            e.preventDefault(); // منع التكرار في الجوال
            
            score++;
            scoreDisplay.textContent = score;
            
            playHitSound();
            createParticles(e.clientX, e.clientY);
            
            target.classList.remove('active');
            clearTimeout(targetTimeout);
            
            // تسريع اللعبة قليلاً مع زيادة النقاط (تحدي أكبر)
            const newLifespan = Math.max(300, TARGET_LIFESPAN - (score * 15));
            
            setTimeout(() => {
                if(gameActive) moveTarget();
            }, 50); // تأخير بسيط جداً قبل ظهور الهدف التالي
        });

        // دالة إنشاء تأثير الانفجار (Particles)
        function createParticles(x, y) {
            const rect = gameArea.getBoundingClientRect();
            const relX = x - rect.left;
            const relY = y - rect.top;

            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = `${relX}px`;
                particle.style.top = `${relY}px`;
                
                // اتجاهات عشوائية
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 50 + 20;
                const xMove = Math.cos(angle) * distance;
                const yMove = Math.sin(angle) * distance;
                
                particle.style.setProperty('--x', `${xMove}px`);
                particle.style.setProperty('--y', `${yMove}px`);
                
                // ألوان عشوائية للجزيئات
                if(i % 2 === 0) {
                    particle.style.background = 'var(--neon-blue)';
                    particle.style.boxShadow = '0 0 10px var(--neon-blue)';
                }

                gameArea.appendChild(particle);

                // إزالة الجزيئات بعد انتهاء الأنيميشن
                setTimeout(() => {
                    particle.remove();
                }, 500);
            }
        }

        // دالة إنهاء اللعبة
        function endGame() {
            gameActive = false;
            clearInterval(gameInterval);
            clearTimeout(targetTimeout);
            target.classList.remove('active');
            
            finalScore.textContent = score;
            
            // تحديث أعلى نتيجة
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neonReflexHighScore', highScore);
                endHighScoreMsg.innerHTML = `🎉 رقم قياسي جديد! 🎉<br>أعلى نتيجة: ${highScore}`;
                endHighScoreMsg.style.color = 'var(--neon-blue)';
                endHighScoreMsg.style.background = 'rgba(0, 243, 255, 0.1)';
            } else {
                endHighScoreMsg.innerHTML = `أعلى نتيجة: ${highScore}`;
                endHighScoreMsg.style.color = '#fff';
                endHighScoreMsg.style.background = 'rgba(255, 255, 255, 0.1)';
            }
            
            highScoreDisplay.textContent = highScore;
            endScreen.classList.remove('hidden');
        }

        // مستمعات الأحداث
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // منع الزوم في الجوال عند النقر المزدوج السريع
        document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
