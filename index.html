<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التركيز والإنتاجية | Focus Board</title>
    
    <!-- أيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- خط عربي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.08), transparent 25%);
        }

        .dashboard {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* رأس الصفحة */
        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .clock-box h2 { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
        .clock-box p { font-size: 0.9rem; color: var(--text-muted); }

        .quote-box {
            font-size: 0.9rem;
            color: var(--text-muted);
            max-width: 60%;
            text-align: left;
            direction: ltr;
            font-style: italic;
        }

        /* البطاقات الأساسية */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i { color: var(--primary); }

        /* ===== قسم المؤقت (Pomodoro) ===== */
        .timer-section {
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .timer-circle {
            position: relative;
            width: 220px;
            height: 220px;
            margin-bottom: 2rem;
        }

        .timer-circle svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .timer-circle circle {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .timer-bg { stroke: rgba(255,255,255,0.05); }
        
        .timer-progress {
            stroke: var(--primary);
            stroke-dasharray: 691; /* 2 * pi * r (110) */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 800;
            direction: ltr;
        }

        .timer-controls {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Tajawal', sans-serif;
        }

        .btn-primary {
            background: var(--primary);
            color: #0f172a;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }

        /* ===== قسم المهام (To-Do) ===== */
        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .input-group input {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.8rem 1rem;
            border-radius: 0.8rem;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus { border-color: var(--primary); }

        .task-list {
            list-style: none;
            overflow-y: auto;
            max-height: 250px;
            padding-left: 5px;
        }

        .task-list::-webkit-scrollbar { width: 6px; }
        .task-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: rgba(255,255,255,0.03);
            border-radius: 0.8rem;
            margin-bottom: 0.8rem;
            border: 1px solid rgba(255,255,255,0.02);
            transition: 0.3s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .task-item:hover { background: rgba(255,255,255,0.06); }

        .task-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .task-item.completed .task-checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .task-item.completed .task-checkbox::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 0.7rem;
            color: white;
        }

        .task-text {
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            padding: 5px;
        }

        .delete-btn:hover { color: var(--danger); transform: scale(1.1); }

        /* استجابة الجوال */
        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
            .header { flex-direction: column; text-align: center; gap: 1rem; padding: 1.5rem; }
            .quote-box { max-width: 100%; text-align: center; }
            .timer-circle { width: 180px; height: 180px; }
            .timer-text { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <!-- الرأس: الساعة والاقتباس -->
        <header class="header">
            <div class="clock-box">
                <h2 id="time">00:00</h2>
                <p id="date">جاري التحميل...</p>
            </div>
            <div class="quote-box" id="quote">
                "النجاح هو مجموع جهود صغيرة تتكرر يوماً بعد يوم."
            </div>
        </header>

        <!-- القسم الأول: مؤقت بومودورو -->
        <div class="card timer-section">
            <div class="card-title"><i class="fas fa-clock"></i> مؤقت التركيز (Pomodoro)</div>
            
            <div class="timer-circle">
                <svg>
                    <circle class="timer-bg" cx="110" cy="110" r="110"></circle>
                    <circle class="timer-progress" id="progress" cx="110" cy="110" r="110"></circle>
                </svg>
                <div class="timer-text" id="timer">25:00</div>
            </div>

            <div class="timer-controls">
                <button class="btn btn-primary" id="startBtn"><i class="fas fa-play"></i> ابدأ</button>
                <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-rotate-left"></i> إعادة</button>
            </div>
        </div>

        <!-- القسم الثاني: قائمة المهام -->
        <div class="card">
            <div class="card-title"><i class="fas fa-list-check"></i> قائمة المهام</div>
            
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="أضف مهمة جديدة..." autocomplete="off">
                <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus"></i></button>
            </div>

            <ul class="task-list" id="taskList">
                <!-- المهام ستظهر هنا تلقائياً -->
            </ul>
        </div>

    </div>

    <script>
        // ================= 1. الساعة والتاريخ =================
        function updateClock() {
            const now = new Date();
            // الوقت
            const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('time').textContent = timeString;
            
            // التاريخ
            const dateString = now.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('date').textContent = dateString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ================= 2. الاقتباسات =================
        const quotes = [
            "النجاح هو مجموع جهود صغيرة تتكرر يوماً بعد يوم.",
            "لا تؤجل عمل اليوم إلى الغد.",
            "التركيز هو سر الإنجاز في وقت قياسي.",
            "افعل شيئاً اليوم يجعلك فخوراً غداً.",
            "الطريق إلى القمة يبدأ بخطوة واحدة."
        ];
        document.getElementById('quote').textContent = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;

        // ================= 3. مؤقت بومودورو =================
        let timer;
        let timeLeft = 25 * 60; // 25 دقيقة
        let isRunning = false;
        const totalTime = 25 * 60;
        const timerDisplay = document.getElementById('timer');
        const progressCircle = document.getElementById('progress');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        const circleRadius = 110;
        const circumference = 2 * Math.PI * circleRadius;

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // تحديث الدائرة
            const offset = circumference - (timeLeft / totalTime) * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        function startTimer() {
            if (isRunning) {
                clearInterval(timer);
                startBtn.innerHTML = '<i class="fas fa-play"></i> استمرار';
                isRunning = false;
            } else {
                isRunning = true;
                startBtn.innerHTML = '<i class="fas fa-pause"></i> إيقاف مؤقت';
                timer = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timer);
                        isRunning = false;
                        startBtn.innerHTML = '<i class="fas fa-play"></i> ابدأ';
                        // تنبيه بسيط عند انتهاء الوقت
                        alert("انتهى وقت التركيز! خذ استراحة قصيرة.");
                        timeLeft = totalTime;
                        updateTimerDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            timeLeft = totalTime;
            updateTimerDisplay();
            startBtn.innerHTML = '<i class="fas fa-play"></i> ابدأ';
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);
        updateTimerDisplay();

        // ================= 4. قائمة المهام (To-Do) =================
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        // جلب المهام من الذاكرة المحلية أو إنشاء مصفوفة فارغة
        let tasks = JSON.parse(localStorage.getItem('focusTasks')) || [];

        function renderTasks() {
            taskList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                li.innerHTML = `
                    <div class="task-content" onclick="toggleTask(${index})">
                        <div class="task-checkbox"></div>
                        <span class="task-text">${task.text}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${index})"><i class="fas fa-trash"></i></button>
                `;
                taskList.appendChild(li);
            });
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text !== '') {
                tasks.push({ text: text, completed: false });
                taskInput.value = '';
                saveAndRender();
            }
        }

        window.toggleTask = function(index) {
            tasks[index].completed = !tasks[index].completed;
            saveAndRender();
        }

        window.deleteTask = function(index) {
            tasks.splice(index, 1);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('focusTasks', JSON.stringify(tasks));
            renderTasks();
        }

        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTask();
        });

        // عرض المهام عند فتح الصفحة
        renderTasks();
    </script>
</body>
</html>
