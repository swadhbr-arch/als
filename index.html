<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أسطورة الميمز | Meme Legend</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a20;
            --primary: #ff0055;
            --success: #00ff66;
            --gold: #ffcc00;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 0, 85, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 102, 0.1) 0%, transparent 40%);
        }

        .game-container {
            position: relative;
            width: 100%; max-width: 480px; height: 100vh; max-height: 850px;
            background: rgba(20, 20, 25, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex; flex-direction: column;
            transition: transform 0.1s;
        }

        .game-container.shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--primary);
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .hud {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: #000;
            border-bottom: 2px solid #333; z-index: 10;
        }

        .hud-item { display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .score-val { color: var(--success); font-size: 1.2rem; }
        .lives-val { font-size: 1.2rem; letter-spacing: 2px; }

        .time-bar-bg {
            width: 100%; height: 6px; background: #333;
        }
        .time-bar {
            height: 100%; width: 100%; background: var(--gold);
            transition: width 0.1s linear;
        }

        .play-area {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 15px; position: relative;
        }

        /* بطاقة الميم */
        .meme-card {
            width: 100%;
            background: #fff;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            align-items: center;
            transform: scale(0.9);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            margin-bottom: 20px;
        }

        @keyframes popIn {
            to { transform: scale(1); }
        }

        .meme-text-top {
            width: 100%;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 900;
            color: #000;
            padding: 5px;
            text-transform: uppercase;
            line-height: 1.3;
        }

        /* الصورة الحقيقية للميم */
        .meme-image-container {
            width: 100%;
            height: 200px;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .meme-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* لملء المساحة */
        }

        /* الإيموجي كبديل في حال فشل تحميل الصورة */
        .meme-fallback-emoji {
            font-size: 6rem;
            display: none;
        }

        .meme-text-bottom {
            width: 100%;
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            color: #888;
            padding: 10px 5px 5px;
            border-top: 2px dashed #ccc;
            margin-top: 10px;
            min-height: 55px;
            display: flex; align-items: center; justify-content: center;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            width: 100%;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: right;
            font-family: 'Cairo', sans-serif;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .option-btn.correct {
            background: var(--success);
            border-color: var(--success);
            color: #000;
            transform: scale(1.02);
        }

        .option-btn.wrong {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .floating-text {
            position: absolute; font-size: 2rem; font-weight: 900;
            pointer-events: none; z-index: 20;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px currentColor;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1.5); opacity: 0; }
        }

        .overlay {
            position: absolute; inset: 0; background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 50;
            text-align: center; padding: 20px; transition: opacity 0.3s;
        }

        .overlay.hidden { display: none; }

        .title {
            font-size: 2.5rem; font-weight: 900; color: #fff;
            margin-bottom: 10px; text-shadow: 3px 3px 0 var(--primary);
        }

        .subtitle {
            font-size: 1rem; color: #aaa; margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            padding: 15px 40px; font-size: 1.2rem; font-weight: 900;
            color: #000; background: #fff; border: none; border-radius: 50px;
            cursor: pointer; transition: all 0.2s;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            font-family: 'Cairo', sans-serif;
        }

        .btn:hover { background: var(--gold); box-shadow: 0 0 30px var(--gold); transform: scale(1.05); }

        .result-emoji { font-size: 6rem; margin-bottom: 15px; animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
        
        .rank-text { font-size: 1.5rem; font-weight: 900; color: var(--gold); margin-bottom: 10px; }
        .final-score { font-size: 1.2rem; color: #fff; margin-bottom: 30px; }

        @media (max-width: 400px) {
            .meme-image-container { height: 160px; }
            .meme-text-top { font-size: 0.95rem; }
            .option-btn { padding: 10px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameWrapper">
        
        <div class="hud">
            <div class="hud-item">النقاط: <span class="score-val" id="scoreVal">0</span></div>
            <div class="hud-item lives-val" id="livesVal">❤️❤️❤️</div>
        </div>

        <div class="time-bar-bg">
            <div class="time-bar" id="timeBar"></div>
        </div>

        <div class="play-area" id="playArea">
            
            <div class="meme-card" id="memeCard" style="display: none;">
                <div class="meme-text-top" id="memeTopText">النص العلوي</div>
                
                <div class="meme-image-container">
                    <!-- الصورة الحقيقية للميم -->
                    <img class="meme-image" id="memeImg" src="" alt="Meme" onerror="this.style.display='none'; document.getElementById('memeFallback').style.display='block';">
                    <!-- الإيموجي كبديل -->
                    <div class="meme-fallback-emoji" id="memeFallback">😭</div>
                </div>

                <div class="meme-text-bottom" id="memeBottomText">... اختار التكملة</div>
            </div>

            <div class="options-container" id="optionsContainer" style="display: none;"></div>
        </div>

        <div class="overlay" id="startScreen">
            <div class="title">أسطورة الميمز</div>
            <div class="subtitle">
                هل تعرف الميمز العربية الكلاسيكية؟<br>
                اختر التكملة الصحيحة بسرعة!
            </div>
            <button class="btn" id="startBtn">يلا نبدأ</button>
        </div>

        <div class="overlay hidden" id="endScreen">
            <div class="result-emoji" id="resultEmoji">🤡</div>
            <div class="title" style="font-size: 2rem; margin-bottom: 5px;">انتهت اللعبة!</div>
            <div class="rank-text" id="rankText">رتبتك: NPC</div>
            <div class="final-score" id="finalScoreText">نقاطك: 0</div>
            <button class="btn" id="restartBtn">العب مرة ثانية</button>
        </div>

    </div>

    <script>
        // ================= بنك الميمز (صور حقيقية + ميمز عربية) =================
        // ملاحظة: روابط الصور من imgflip وهي روابط مباشرة مضمونة.
        const memesData = [
            {
                top: "لما تفتح الفيسبوك الساعة 3 الفجر...",
                image: "https://i.imgflip.com/30b1gx.jpg", // Drake meme
                fallbackEmoji: "🌙",
                options: ["تلاقي حرب عالمية في الكومنتات", "تلاقي الأهل صاحيين", "تلاقي النت فصل", "تلاقي إعلان كورس"],
                correct: 0
            },
            {
                top: "أنا مش زعلان...",
                image: "https://i.imgflip.com/1ur9b0.jpg", // This is fine dog
                fallbackEmoji: "💔",
                options: ["أنا مبسوط جداً", "أنا بس مقهور", "أنا نايم", "أنا جعان"],
                correct: 1
            },
            {
                top: "عايز أقولك حاجة...",
                image: "https://i.imgflip.com/261o3j.jpg", // Mocking Spongebob
                fallbackEmoji: "🤫",
                options: ["بس مش عارف أقولها", "بس خلاص", "بس استنى", "بس هسكت"],
                correct: 0
            },
            {
                top: "المدرس: مين عمل الواجب؟",
                image: "https://i.imgflip.com/1otk96.jpg", // Woman yelling at cat
                fallbackEmoji: "👀",
                options: ["أنا: *رفعت إيدي*", "أنا: *نمت*", "أنا: *بص في الأرض*", "أنا: *هربت*"],
                correct: 2
            },
            {
                top: "لما تقول لأمك أنا نازل أتمشى...",
                image: "https://i.imgflip.com/1e7ql7.jpg", // Distracted boyfriend
                fallbackEmoji: "🏃‍♂️",
                options: ["تقولك خد بالك من نفسك", "ترجع تلاقي أوضتك اتظبطت", "تقولك هاتلي معاك حاجة", "تسكت وتزعل"],
                correct: 1
            },
            {
                top: "شخص يقولك أنا هخسر 10 كيلو...",
                image: "https://i.imgflip.com/1h7in3.jpg", // Roll safe (thinking guy)
                fallbackEmoji: "🍔",
                options: ["وهو بياكل برجر", "وهو في الجيم", "وهو نايم", "وهو بيشرب ميه"],
                correct: 0
            },
            {
                top: "لما تيجي تذاكر...",
                image: "https://i.imgflip.com/2kbn1e.jpg", // Waiting skeleton
                fallbackEmoji: "📚",
                options: ["تفتح الفيسبوك", "تنام", "تذاكر بجد", "تاكل"],
                correct: 0
            },
            {
                top: "أنا مش كسول...",
                image: "https://i.imgflip.com/1bgw.jpg", // Pepe
                fallbackEmoji: "🛌",
                options: ["أنا بستريح بس", "أنا نايم", "أنا مريض", "أنا مشغول"],
                correct: 0
            },
            {
                top: "لما حد يقولك نصيحة...",
                image: "https://i.imgflip.com/2kbn1f.jpg", // Surprised pikachu
                fallbackEmoji: "🤡",
                options: ["تسمعها", "تعمل عكسها", "تقوله أنا عارف", "تنام"],
                correct: 1
            },
            {
                top: "لما تقول لحد أنا هغير حياتي...",
                image: "https://i.imgflip.com/2y4g3o.jpg", // The rock eyebrow
                fallbackEmoji: "🚀",
                options: ["تبدأ بكرة", "تبدأ بعدين", "تبدأ الشهر الجاي", "تصحى الساعة 2 الضهر"],
                correct: 3
            }
        ];

        // العناصر
        const gameWrapper = document.getElementById('gameWrapper');
        const playArea = document.getElementById('playArea');
        const memeCard = document.getElementById('memeCard');
        const memeTopText = document.getElementById('memeTopText');
        const memeImg = document.getElementById('memeImg');
        const memeFallback = document.getElementById('memeFallback');
        const memeBottomText = document.getElementById('memeBottomText');
        const optionsContainer = document.getElementById('optionsContainer');
        
        const scoreVal = document.getElementById('scoreVal');
        const livesVal = document.getElementById('livesVal');
        const timeBar = document.getElementById('timeBar');

        const startScreen = document.getElementById('startScreen');
        const endScreen = document.getElementById('endScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        let score = 0;
        let lives = 3;
        let isPlaying = false;
        let currentQuestion = null;
        let availableQuestions = [];
        let roundTimer;
        let timeLeft = 0;
        const MAX_TIME = 8; // 8 ثواني

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            }

            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function startGame() {
            score = 0;
            lives = 3;
            isPlaying = true;
            
            scoreVal.textContent = score;
            updateLivesUI();
            
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            
            memeCard.style.display = 'flex';
            optionsContainer.style.display = 'flex';
            
            availableQuestions = [...memesData].sort(() => 0.5 - Math.random());
            
            nextQuestion();
        }

        function updateLivesUI() {
            livesVal.textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
        }

        function nextQuestion() {
            if (!isPlaying) return;

            if (availableQuestions.length === 0) {
                availableQuestions = [...memesData].sort(() => 0.5 - Math.random());
            }

            currentQuestion = availableQuestions.pop();
            
            memeTopText.textContent = currentQuestion.top;
            
            // تحديث الصورة (مع معالجة الخطأ)
            memeImg.style.display = 'block';
            memeFallback.style.display = 'none';
            memeFallback.textContent = currentQuestion.fallbackEmoji;
            memeImg.src = currentQuestion.image;
            
            memeBottomText.textContent = "اختر التكملة الصحيحة...";
            memeBottomText.style.color = '#888';
            
            optionsContainer.innerHTML = '';
            
            const shuffledOptions = currentQuestion.options.map((opt, index) => ({
                text: opt,
                isCorrect: index === currentQuestion.correct
            })).sort(() => 0.5 - Math.random());

            shuffledOptions.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.text;
                btn.addEventListener('click', () => handleAnswer(btn, opt.isCorrect));
                optionsContainer.appendChild(btn);
            });

            memeCard.style.animation = 'none';
            void memeCard.offsetWidth; 
            memeCard.style.animation = 'popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';

            timeLeft = MAX_TIME;
            timeBar.style.transition = 'none';
            timeBar.style.width = '100%';
            timeBar.style.background = 'var(--gold)';
            
            void timeBar.offsetWidth;
            
            timeBar.style.transition = `width ${MAX_TIME}s linear`;
            timeBar.style.width = '0%';

            clearInterval(roundTimer);
            roundTimer = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 2.5) timeBar.style.background = 'var(--primary)';
                if (timeLeft <= 0) {
                    handleTimeOut();
                }
            }, 100);
        }

        function handleAnswer(clickedBtn, isCorrect) {
            if (!isPlaying) return;
            clearInterval(roundTimer);

            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.style.pointerEvents = 'none');

            if (isCorrect) {
                playSound('correct');
                clickedBtn.classList.add('correct');
                
                const points = Math.round(10 + (timeLeft * 2));
                score += points;
                scoreVal.textContent = score;
                
                memeBottomText.textContent = clickedBtn.textContent;
                memeBottomText.style.color = 'var(--success)';
                
                showFloatingText(playArea.clientWidth/2, playArea.clientHeight/2, `+${points}`, 'var(--success)');
                
                setTimeout(() => nextQuestion(), 1200);
                
            } else {
                playSound('wrong');
                clickedBtn.classList.add('wrong');
                
                allBtns.forEach(btn => {
                    if (btn.textContent === currentQuestion.options[currentQuestion.correct]) {
                        btn.classList.add('correct');
                    }
                });

                memeBottomText.textContent = currentQuestion.options[currentQuestion.correct];
                memeBottomText.style.color = 'var(--primary)';

                gameWrapper.classList.add('shake');
                loseLife();
            }
        }

        function handleTimeOut() {
            if (!isPlaying) return;
            playSound('wrong');
            
            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            allBtns.forEach(btn => {
                btn.style.pointerEvents = 'none';
                if (btn.textContent === currentQuestion.options[currentQuestion.correct]) {
                    btn.classList.add('correct');
                }
            });

            memeBottomText.textContent = "انتهى الوقت! الإجابة: " + currentQuestion.options[currentQuestion.correct];
            memeBottomText.style.color = 'var(--primary)';

            gameWrapper.classList.add('shake');
            loseLife();
        }

        function loseLife() {
            lives--;
            updateLivesUI();

            setTimeout(() => {
                gameWrapper.classList.remove('shake');
                if (lives <= 0) {
                    endGame();
                } else {
                    nextQuestion();
                }
            }, 2000);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(roundTimer);
            
            memeCard.style.display = 'none';
            optionsContainer.style.display = 'none';

            let rank = "مبتدئ في الميمز 🐣";
            let resultEmoji = "🤡";
            
            if (score >= 150) {
                rank = "أسطورة الميمز 👑";
                resultEmoji = "🗿";
            } else if (score >= 100) {
                rank = "خبير ميمز 🧠";
                resultEmoji = "😎";
            } else if (score >= 50) {
                rank = "ميمر مبتدئ 📱";
                resultEmoji = "😭";
            }

            document.getElementById('finalScoreText').textContent = `نقاطك: ${score}`;
            document.getElementById('rankText').textContent = `رتبتك: ${rank}`;
            document.getElementById('resultEmoji').textContent = resultEmoji;
            
            endScreen.classList.remove('hidden');
        }

        function showFloatingText(x, y, text, color) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            playArea.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
