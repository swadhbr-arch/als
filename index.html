<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبدالرحيم الجياشي الشمري | الهوية الرقمية</title>
    
    <!-- أيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- خطوط عربية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background-color: #030408;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            overflow: hidden; /* لمنع التمرير بسبب الخلفية */
            position: relative;
            color: #fff;
        }

        /* ===== الخلفية السينمائية (نجوم متحركة) ===== */
        #stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 0.8; transform: scale(1.2); }
        }

        /* ===== الحاوية الرئيسية ===== */
        .id-card-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            animation: floatIn 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== الهوية الرقمية (البطاقة) ===== */
        .digital-card {
            background: rgba(15, 18, 30, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 2rem;
            padding: 2.5rem 1.5rem 2rem;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* إطار الهولوغرام المتوهج */
        .digital-card::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 2.1rem;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #f093fb, #f5576c, #4facfe, #00f2fe);
            background-size: 300% 300%;
            z-index: -1;
            animation: hologramGlow 5s linear infinite;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }
        
        .digital-card:hover::before {
            opacity: 1;
        }

        @keyframes hologramGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* خطوط التصميم الداخلي (HUD) */
        .hud-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
        }
        .hud-top { top: 15px; right: 15px; width: 30px; height: 2px; }
        .hud-bottom { bottom: 15px; left: 15px; width: 30px; height: 2px; }

        /* ===== الصورة والبروفايل ===== */
        .avatar-box {
            position: relative;
            width: 115px;
            height: 115px;
            margin-bottom: 1.2rem;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.05));
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0f121e;
        }

        /* شريط الحالة (متصل الآن) */
        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 10px;
            width: 18px;
            height: 18px;
            background: #10b981;
            border: 3px solid #0f121e;
            border-radius: 50%;
            z-index: 3;
            animation: pulseStatus 2s infinite;
        }

        @keyframes pulseStatus {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* الاسم والتوثيق */
        .name-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 0.3rem;
        }

        .name-text {
            font-family: 'Cairo', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            white-space: nowrap;
            background: linear-gradient(to right, #fff, #b8ccff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* علامة التوثيق الاحترافية */
        .verified-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: #1d9bf0;
            border-radius: 50%;
            color: white;
            font-size: 0.55rem;
            box-shadow: 0 0 10px rgba(29, 155, 240, 0.8);
        }

        .user-title {
            font-size: 0.85rem;
            color: #8892b0;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        /* ===== أزرار الحسابات (شكل شرائح تفاعلية) ===== */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
        }

        .social-btn {
            display: flex;
            align-items: center;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem;
            text-decoration: none;
            color: #fff;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* تأثير التداخل الضوئي عند التمرير */
        .social-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .social-btn:hover::before {
            left: 100%;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* أيقونة المنصة */
        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-left: 1rem;
            transition: transform 0.4s ease;
        }

        .social-btn:hover .btn-icon {
            transform: scale(1.15) rotate(10deg);
        }

        .icon-tk { background: #000; color: #fff; border: 1px solid #25f4ee; }
        .icon-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #fff; }
        .icon-fb { background: #1877f2; color: #fff; }

        /* محتوى الزر */
        .btn-content {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .btn-name {
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-name i {
            color: #1d9bf0;
            font-size: 0.75rem;
        }

        .btn-handle {
            font-size: 0.75rem;
            color: #8892b0;
            direction: ltr;
            text-align: right;
            margin-top: 2px;
        }

        /* أيقونة الانتقال */
        .btn-arrow {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .social-btn:hover .btn-arrow {
            color: #fff;
            transform: translateX(-3px);
        }

        @media (max-width: 360px) {
            .name-text { font-size: 1.15rem; }
            .digital-card { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>

    <!-- خلفية النجوم المتلألئة -->
    <div id="stars-container"></div>

    <div class="id-card-wrapper">
        <div class="digital-card">
            <!-- خطوط التصميم الداخلي -->
            <div class="hud-line hud-top"></div>
            <div class="hud-line hud-bottom"></div>

            <!-- الصورة -->
            <div class="avatar-box">
                <img src="logo.png" alt="عبدالرحيم الجياشي الشمري" onerror="this.src='https://ui-avatars.com/api/?name=عبدالرحيم&background=0f121e&color=fff&size=115'">
                <div class="status-dot" title="متصل"></div>
            </div>

            <!-- الاسم + التوثيق -->
            <div class="name-container">
                <div class="name-text">عبدالرحيم الجياشي الشمري</div>
                <div class="verified-icon" title="موثق">
                    <i class="fas fa-check"></i>
                </div>
            </div>
            
            <div class="user-title">DIGITAL IDENTITY</div>

            <!-- الروابط -->
            <div class="social-links">
                <!-- تيك توك -->
                <a href="https://www.tiktok.com/@r_epd" target="_blank" class="social-btn">
                    <div class="btn-icon icon-tk"><i class="fab fa-tiktok"></i></div>
                    <div class="btn-content">
                        <div class="btn-name">تيك توك <i class="fas fa-check-circle"></i></div>
                        <div class="btn-handle">@r_epd</div>
                    </div>
                    <i class="fas fa-chevron-left btn-arrow"></i>
                </a>

                <!-- انستغرام -->
                <a href="https://www.instagram.com/alsamkark" target="_blank" class="social-btn">
                    <div class="btn-icon icon-ig"><i class="fab fa-instagram"></i></div>
                    <div class="btn-content">
                        <div class="btn-name">إنستغرام <i class="fas fa-check-circle"></i></div>
                        <div class="btn-handle">@alsamkark</div>
                    </div>
                    <i class="fas fa-chevron-left btn-arrow"></i>
                </a>

                <!-- فيسبوك -->
                <a href="https://www.facebook.com/share/1CCY33nfm3/" target="_blank" class="social-btn">
                    <div class="btn-icon icon-fb"><i class="fab fa-facebook-f"></i></div>
                    <div class="btn-content">
                        <div class="btn-name">فيسبوك <i class="fas fa-check-circle"></i></div>
                        <div class="btn-handle">facebook.com/share/1CCY...</div>
                    </div>
                    <i class="fas fa-chevron-left btn-arrow"></i>
                </a>
            </div>

        </div>
    </div>

    <!-- سكربت بسيط لتوليد النجوم في الخلفية -->
    <script>
        const starsContainer = document.getElementById('stars-container');
        const starCount = 50; // عدد النجوم

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            // حجم عشوائي
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            
            // مكان عشوائي
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            
            // سرعة وتأخير عشوائي للنبض
            star.style.animationDuration = `${Math.random() * 2 + 1}s`;
            star.style.animationDelay = `${Math.random() * 2}s`;
            
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
