<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brainrot Tester | لعبة الميمز</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #111;
            --text-main: #fff;
            --accent: #ff0055;
            --success: #00ff66;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none; -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            /* خلفية ميمز متحركة */
            background-image: repeating-linear-gradient(
                45deg,
                #111 0px,
                #111 20px,
                #1a1a1a 20px,
                #1a1a1a 40px
            );
            animation: bgMove 10s linear infinite;
        }

        @keyframes bgMove {
            100% { background-position: 100px 100px; }
        }

        /* ===== حاوية اللعبة ===== */
        .game-wrapper {
            position: relative;
            width: 100%; max-width: 500px; height: 100vh; max-height: 800px;
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid #fff;
            box-shadow: 10px 10px 0px #000, 15px 15px 0px var(--accent);
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* تأثير الاهتزاز عند الخطأ */
        .game-wrapper.shake {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* ===== شريط المعلومات ===== */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px;
            background: #000;
            border-bottom: 3px solid #fff;
            z-index: 10;
        }

        .score-box {
            font-size: 1.5rem; font-weight: 900; color: var(--success);
            text-shadow: 2px 2px 0px #000;
        }

        .lives-box {
            font-size: 1.5rem; letter-spacing: 5px;
        }

        /* ===== منطقة اللعب ===== */
        .play-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* الأمر المطلوب (النص) */
        .prompt-container {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; text-align: center; z-index: 10;
            background: #fff; color: #000;
            padding: 15px; border-radius: 10px;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px var(--accent);
            transition: all 0.2s;
        }

        .prompt-container.trick {
            background: var(--accent); color: #fff;
            border-color: #fff;
            box-shadow: 6px 6px 0px #fff;
            animation: pulseTrick 0.5s infinite alternate;
        }

        @keyframes pulseTrick {
            from { transform: translateX(-50%) scale(1); }
            to { transform: translateX(-50%) scale(1.05); }
        }

        .prompt-text {
            font-size: 1.4rem; font-weight: 900; line-height: 1.4;
        }

        /* شريط الوقت */
        .time-bar-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 8px;
            background: #333; z-index: 11;
        }
        .time-bar {
            height: 100%; width: 100%; background: var(--success);
            transition: width 0.1s linear;
        }

        /* ===== الإيموجيز (الميمز) ===== */
        .meme-emoji {
            position: absolute;
            font-size: 4rem;
            cursor: pointer;
            transition: transform 0.1s;
            z-index: 5;
            filter: drop-shadow(0px 0px 10px rgba(255,255,255,0.3));
            animation: floatEmoji 3s infinite alternate ease-in-out;
        }

        .meme-emoji:active {
            transform: scale(0.8);
        }

        /* حركة عشوائية للإيموجي */
        @keyframes floatEmoji {
            0% { transform: translate(0, 0) rotate(-10deg); }
            100% { transform: translate(15px, 20px) rotate(10deg); }
        }

        /* ===== النصوص الطائرة ===== */
        .floating-text {
            position: absolute; font-size: 2rem; font-weight: 900;
            pointer-events: none; z-index: 20;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 2px 2px 0px #000;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1.5); opacity: 0; }
        }

        /* ===== الشاشات (القوائم) ===== */
        .overlay {
            position: absolute; inset: 0;
            background: #000;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 50; text-align: center; padding: 20px;
        }

        .overlay.hidden { display: none; }

        .title {
            font-size: 3rem; font-weight: 900; color: #fff;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px var(--accent), 6px 6px 0px #00f3ff;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.2rem; color: #ccc; margin-bottom: 30px;
            background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 10px;
        }

        .btn {
            padding: 15px 40px; font-size: 1.5rem; font-weight: 900;
            color: #000; background: #fff;
            border: 4px solid #000; box-shadow: 6px 6px 0px var(--accent);
            cursor: pointer; transition: all 0.1s;
            font-family: 'Cairo', sans-serif;
        }

        .btn:hover { background: var(--accent); color: #fff; }
        .btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0px var(--accent); }

        .result-meme {
            font-size: 6rem; margin-bottom: 20px;
        }

        .rank-title {
            font-size: 2rem; color: var(--success); font-weight: 900;
            margin-bottom: 10px;
        }

        /* تأثيرات الشاشة عند الخسارة */
        .flash-red { background: var(--accent) !important; transition: background 0.1s; }
        .flash-green { background: var(--success) !important; transition: background 0.1s; }

    </style>
</head>
<body>

    <div class="game-wrapper" id="gameWrapper">
        
        <!-- الشريط العلوي -->
        <div class="header">
            <div class="score-box">النقاط: <span id="scoreVal">0</span></div>
            <div class="lives-box" id="livesVal">❤️❤️❤️</div>
        </div>

        <!-- منطقة اللعب -->
        <div class="play-area" id="playArea">
            <!-- شريط الوقت -->
            <div class="time-bar-container">
                <div class="time-bar" id="timeBar"></div>
            </div>

            <!-- الأمر (النص) -->
            <div class="prompt-container" id="promptBox">
                <div class="prompt-text" id="promptText">استعد...</div>
            </div>
            <!-- الإيموجيز ستظهر هنا -->
        </div>

        <!-- شاشة البداية -->
        <div class="overlay" id="startScreen">
            <div class="title">تعفن<br>الدماغ</div>
            <div class="subtitle">هل يمكنك اتباع الأوامر وسط هذه الفوضى؟</div>
            <button class="btn" id="startBtn">ابدأ اللعبة</button>
        </div>

        <!-- شاشة النهاية -->
        <div class="overlay hidden" id="endScreen">
            <div class="result-meme" id="resultMeme">💀</div>
            <div class="title" style="font-size: 2rem; margin-bottom: 5px;">انتهت اللعبة!</div>
            <div class="rank-title" id="rankTitle">رتبتك: NPC</div>
            <div class="subtitle" style="margin-bottom: 20px;">نقاطك: <span id="finalScore">0</span></div>
            <button class="btn" id="restartBtn">حاول مجدداً</button>
        </div>

    </div>

    <script>
        // ================= البيانات =================
        const memes = [
            { emoji: '💀', name: 'الجمجمة' },
            { emoji: '🤡', name: 'المهرج' },
            { emoji: '🗿', name: 'مجسم مواي' },
            { emoji: '🐸', name: 'الضفدع' },
            { emoji: '👽', name: 'الفضائي' },
            { emoji: '😭', name: 'البكاء' },
            { emoji: '🐶', name: 'الكلب' },
            { emoji: '🍕', name: 'البيتزا' }
        ];

        // العناصر
        const gameWrapper = document.getElementById('gameWrapper');
        const playArea = document.getElementById('playArea');
        const promptBox = document.getElementById('promptBox');
        const promptText = document.getElementById('promptText');
        const timeBar = document.getElementById('timeBar');
        const scoreVal = document.getElementById('scoreVal');
        const livesVal = document.getElementById('livesVal');
        
        // الشاشات
        const startScreen = document.getElementById('startScreen');
        const endScreen = document.getElementById('endScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // متغيرات اللعبة
        let score = 0;
        let lives = 3;
        let isPlaying = false;
        let currentRound = 0;
        let correctEmoji = null;
        let isTrickQuestion = false;
        let roundTimer;
        let timeLeft = 0;
        let maxTime = 0;
        let currentEmojis = []; // لتخزين الإيموجيز الموجودة بالشاشة

        // ================= الأصوات =================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            if (type === 'correct') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            } else if (type === 'trick') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            }

            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // ================= بدء اللعبة =================
        function startGame() {
            score = 0;
            lives = 3;
            currentRound = 0;
            isPlaying = true;
            
            scoreVal.textContent = score;
            updateLivesUI();
            
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            
            startRound();
        }

        function updateLivesUI() {
            livesVal.textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
        }

        // ================= بدء الجولة =================
        function startRound() {
            if (!isPlaying) return;

            // تنظيف الشاشة
            playArea.querySelectorAll('.meme-emoji').forEach(el => el.remove());
            currentEmojis = [];
            promptBox.classList.remove('trick');
            playArea.classList.remove('flash-red', 'flash-green');
            
            // زيادة الصعوبة مع كل جولة
            currentRound++;
            maxTime = Math.max(2.0, 4.0 - (currentRound * 0.1)); // الوقت يقل تدريجياً
            timeLeft = maxTime;
            
            // تحديد ما إذا كان سؤالاً مقلوباً (Trick) بنسبة 30%
            isTrickQuestion = Math.random() < 0.3;

            // اختيار 4 إيموجيز عشوائية للشاشة
            const shuffledMemes = [...memes].sort(() => 0.5 - Math.random());
            const selectedMemes = shuffledMemes.slice(0, 4);
            
            // اختيار الإيموجي الصحيح من بينهم
            const targetMeme = selectedMemes[Math.floor(Math.random() * selectedMemes.length)];
            correctEmoji = targetMeme.emoji;

            // تحديث النص
            if (isTrickQuestion) {
                promptText.textContent = `ممنوع تضغط على ${targetMeme.name} ${targetMeme.emoji}!`;
                promptBox.classList.add('trick');
                playSound('trick');
            } else {
                promptText.textContent = `اضغط على ${targetMeme.name} ${targetMeme.emoji}`;
            }

            // توليد الإيموجيز في الشاشة
            selectedMemes.forEach((meme, index) => {
                const el = document.createElement('div');
                el.className = 'meme-emoji';
                el.textContent = meme.emoji;
                
                // تحديد موقع عشوائي (مع ترك مساحة للنص العلوي)
                const padding = 40;
                const maxX = playArea.clientWidth - padding - 60;
                const maxY = playArea.clientHeight - padding - 120;
                
                el.style.left = `${Math.random() * maxX + padding}px`;
                el.style.top = `${Math.random() * maxY + 120}px`; // 120px لترك مساحة للنص
                
                // سرعة عشوائية للحركة
                el.style.animationDuration = `${Math.random() * 2 + 1.5}s`;
                el.style.animationDelay = `${Math.random()}s`;

                // حدث النقر
                el.addEventListener('pointerdown', (e) => handleEmojiClick(e, meme.emoji));
                
                playArea.appendChild(el);
                currentEmojis.push(el);
            });

            // تشغيل المؤقت
            clearInterval(roundTimer);
            timeBar.style.transition = 'none';
            timeBar.style.width = '100%';
            
            // إجبار المتصفح على تحديث التصميم قبل بدء الحركة
            void timeBar.offsetWidth; 
            
            timeBar.style.transition = `width ${maxTime}s linear`;
            timeBar.style.width = '0%';

            roundTimer = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    roundFailed("انتهى الوقت!");
                }
            }, 100);
        }

        // ================= معالجة النقر =================
        function handleEmojiClick(e, clickedEmoji) {
            if (!isPlaying) return;
            e.preventDefault();

            const rect = playArea.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (isTrickQuestion) {
                // إذا كان السؤال مقلوباً (ممنوع تضغط)
                if (clickedEmoji === correctEmoji) {
                    // لقد ضغط على الممنوع!
                    roundFailed("لقد ضغطت على الممنوع! 🤡", x, y);
                } else {
                    // ضغط على أي إيموجي آخر (وهذا يعتبر نجاحاً لأنه تجنب الممنوع)
                    roundSuccess(x, y);
                }
            } else {
                // سؤال عادي
                if (clickedEmoji === correctEmoji) {
                    // إجابة صحيحة
                    roundSuccess(x, y);
                } else {
                    // إجابة خاطئة
                    roundFailed("إيموجي خاطئ! 💀", x, y);
                }
            }
        }

        // ================= النجاح والفشل =================
        function roundSuccess(x, y) {
            clearInterval(roundTimer);
            playSound('correct');
            
            score += 10 * (isTrickQuestion ? 2 : 1); // نقاط مضاعفة للأسئلة المقلوبة
            scoreVal.textContent = score;
            
            playArea.classList.add('flash-green');
            showFloatingText(x, y, isTrickQuestion ? '+20 (ذكي!)' : '+10', '#00ff66');
            
            // الانتقال للجولة التالية بعد تأخير بسيط
            setTimeout(() => {
                playArea.classList.remove('flash-green');
                startRound();
            }, 500);
        }

        function roundFailed(reason, x, y) {
            if (!isPlaying) return;
            clearInterval(roundTimer);
            playSound('wrong');
            
            lives--;
            updateLivesUI();
            
            gameWrapper.classList.add('shake');
            playArea.classList.add('flash-red');
            
            if (x && y) showFloatingText(x, y, 'خطأ! ❌', '#ff0055');
            
            // إيقاف اللعبة لحظياً لتجنب النقر المتكرر
            isPlaying = false; 

            setTimeout(() => {
                gameWrapper.classList.remove('shake');
                playArea.classList.remove('flash-red');
                
                if (lives <= 0) {
                    endGame();
                } else {
                    isPlaying = true;
                    startRound();
                }
            }, 800);
        }

        // ================= إنهاء اللعبة =================
        function endGame() {
            isPlaying = false;
            clearInterval(roundTimer);
            
            // تحديد الرتبة بناءً على النقاط
            let rank = "NPC";
            let resultEmoji = "🤡";
            
            if (score > 150) {
                rank = "Sigma Male 🗿";
                resultEmoji = "🗿";
            } else if (score > 80) {
                rank = "متعفن الدماغ 🧠";
                resultEmoji = "💀";
            } else if (score > 30) {
                rank = "طفل تيك توك 📱";
                resultEmoji = "😭";
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('rankTitle').textContent = `رتبتك: ${rank}`;
            document.getElementById('resultMeme').textContent = resultEmoji;
            
            endScreen.classList.remove('hidden');
        }

        // ================= التأثيرات =================
        function showFloatingText(x, y, text, color) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            playArea.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // ================= المستمعات =================
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        
        // منع التكبير باللمس المزدوج في الجوال
        document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

    </script>
</body>
</html>
