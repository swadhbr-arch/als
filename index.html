<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Reflex 2.0 | تحدي المستويات</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --neon-red: #ff0055;
            --neon-gold: #ffcc00;
            --bg-color: #050510;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at center, rgba(0, 243, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at bottom, rgba(255, 0, 234, 0.05) 0%, transparent 50%);
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 90vh;
            max-height: 700px;
            background: rgba(10, 15, 30, 0.8);
            border: 2px solid rgba(0, 243, 255, 0.3);
            border-radius: 1.5rem;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 243, 255, 0.1);
            overflow: hidden;
            cursor: crosshair;
            transition: border-color 0.3s;
        }

        /* تأثير الارتجاج عند الخطأ */
        .game-wrapper.shake {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--neon-red);
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.3), inset 0 0 20px rgba(255, 0, 85, 0.2);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* شريط المعلومات العلوي */
        .hud {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            padding: 1rem 1.2rem;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(5,5,16,0.95), transparent);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .time-value { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }
        .level-value { color: var(--neon-gold); text-shadow: 0 0 10px var(--neon-gold); }

        /* إشعار المستوى الجديد */
        .level-up-notification {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 3rem;
            font-weight: 900;
            color: var(--neon-gold);
            text-shadow: 0 0 20px var(--neon-gold);
            z-index: 15;
            pointer-events: none;
            opacity: 0;
        }

        .level-up-notification.show {
            animation: levelUpAnim 1.5s ease-out forwards;
        }

        @keyframes levelUpAnim {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        /* الهدف الأساسي */
        .target {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            cursor: pointer;
            z-index: 5;
            display: none;
            transition: background 0.2s, box-shadow 0.2s;
        }

        /* الهدف العادي (أزرق) */
        .target.normal {
            width: 50px; height: 50px;
            background: var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 10px #fff;
        }

        /* الهدف الذهبي (وقت إضافي) */
        .target.gold {
            width: 50px; height: 50px;
            background: var(--neon-gold);
            box-shadow: 0 0 25px var(--neon-gold), inset 0 0 15px #fff;
            border: 2px solid #fff;
        }
        .target.gold::after {
            content: '\f005'; /* أيقونة النجمة */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.2rem;
            text-shadow: 0 0 5px #000;
        }

        /* القنبلة (خصم وقت) */
        .target.bomb {
            width: 50px; height: 50px;
            background: var(--neon-red);
            box-shadow: 0 0 25px var(--neon-red), inset 0 0 15px #fff;
            border: 2px solid #fff;
        }
        .target.bomb::after {
            content: '\f1e2'; /* أيقونة القنبلة */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.2rem;
        }

        .target.active {
            display: block;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            to { transform: translate(-50%, -50%) scale(1); }
        }

        /* حركة الأهداف في المراحل المتقدمة */
        .target.moving {
            animation: popIn 0.2s forwards, floatTarget 2s infinite alternate ease-in-out;
        }

        @keyframes floatTarget {
            0% { margin-left: -20px; margin-top: -20px; }
            100% { margin-left: 20px; margin-top: 20px; }
        }

        /* الجزيئات (الانفجار) */
        .particle {
            position: absolute;
            width: 8px; height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
            transform: translate(-50%, -50%);
            animation: explode 0.6s ease-out forwards;
        }

        @keyframes explode {
            to {
                transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0);
                opacity: 0;
            }
        }

        /* شاشات البداية والنهاية */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 16, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 2rem;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .game-title span { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }

        .game-desc {
            font-size: 0.95rem;
            color: #a0aabf;
            margin-bottom: 1.5rem;
            max-width: 90%;
            line-height: 1.6;
        }

        .rules-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            text-align: right;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .rules-box p { margin-bottom: 0.5rem; display: flex; align-items: center; gap: 8px; }
        .rules-box p:last-child { margin-bottom: 0; }
        .rule-blue { color: var(--neon-blue); font-weight: bold; }
        .rule-gold { color: var(--neon-gold); font-weight: bold; }
        .rule-red { color: var(--neon-red); font-weight: bold; }

        .btn {
            padding: 0.8rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: #000;
            background: var(--neon-blue);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--neon-blue);
            transition: all 0.2s;
            font-family: 'Tajawal', sans-serif;
        }

        .btn:hover {
            background: #fff;
            box-shadow: 0 0 30px #fff, 0 0 10px var(--neon-blue);
            transform: scale(1.05);
        }

        .final-score {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 20px var(--neon-blue);
            margin: 0.5rem 0;
        }

        .high-score-text {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.4rem 1.5rem;
            border-radius: 20px;
        }

    </style>
</head>
<body>

    <div class="game-wrapper" id="gameArea">
        
        <!-- شريط النقاط والوقت والمستوى -->
        <div class="hud">
            <div class="stat-box">
                <span class="stat-label">Score</span>
                <span class="stat-value" id="scoreDisplay">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Level</span>
                <span class="stat-value level-value" id="levelDisplay">1</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Time</span>
                <span class="stat-value time-value" id="timeDisplay">30</span>
            </div>
        </div>

        <!-- نص المستوى الجديد -->
        <div class="level-up-notification" id="levelUpText">LEVEL UP!</div>

        <!-- الهدف -->
        <div class="target" id="target"></div>

        <!-- شاشة البداية -->
        <div class="overlay" id="startScreen">
            <h1 class="game-title">NEON <span>REFLEX 2.0</span></h1>
            
            <div class="rules-box">
                <p><i class="fas fa-circle" style="color: var(--neon-blue);"></i> <span class="rule-blue">أزرق:</span> نقاط عادية (+1)</p>
                <p><i class="fas fa-star" style="color: var(--neon-gold);"></i> <span class="rule-gold">ذهبي:</span> وقت إضافي (+3 ثواني)</p>
                <p><i class="fas fa-bomb" style="color: var(--neon-red);"></i> <span class="rule-red">أحمر:</span> قنبلة! (خصم 3 ثواني)</p>
            </div>
            
            <div class="high-score-text">أعلى نتيجة: <span id="highScoreDisplay">0</span></div>
            
            <button class="btn" id="startBtn">ابدأ اللعب</button>
        </div>

        <!-- شاشة النهاية -->
        <div class="overlay hidden" id="endScreen">
            <h1 class="game-title">انتهى الوقت!</h1>
            <div class="final-score" id="finalScore">0</div>
            <p class="game-desc">وصلت للمرحلة: <span id="endLevel" style="color: var(--neon-gold); font-weight: bold;">1</span></p>
            
            <div class="high-score-text" id="endHighScoreMsg">أعلى نتيجة: 0</div>
            
            <button class="btn" id="restartBtn">إعادة المحاولة</button>
        </div>

    </div>

    <!-- تضمين مكتبة الأيقونات للأهداف -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // إعدادات اللعبة الأساسية
        const GAME_TIME = 30;
        
        // العناصر
        const gameArea = document.getElementById('gameArea');
        const target = document.getElementById('target');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timeDisplay = document.getElementById('timeDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const startScreen = document.getElementById('startScreen');
        const endScreen = document.getElementById('endScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const finalScore = document.getElementById('finalScore');
        const endLevel = document.getElementById('endLevel');
        const endHighScoreMsg = document.getElementById('endHighScoreMsg');
        const levelUpText = document.getElementById('levelUpText');

        // المتغيرات
        let score = 0;
        let timeLeft = GAME_TIME;
        let level = 1;
        let gameActive = false;
        let gameInterval;
        let targetTimeout;
        let currentTargetType = 'normal';
        
        // مدة بقاء الهدف تبدأ بـ 900ms وتقل مع المستويات
        let currentLifespan = 900; 

        let highScore = localStorage.getItem('neonReflexHighScore') || 0;
        highScoreDisplay.textContent = highScore;

        // الأصوات
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else if (type === 'bomb') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            } else if (type === 'gold') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            }

            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function startGame() {
            score = 0;
            timeLeft = GAME_TIME;
            level = 1;
            currentLifespan = 900;
            gameActive = true;
            
            updateUI();
            
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            gameArea.classList.remove('shake');
            
            clearInterval(gameInterval);
            clearTimeout(targetTimeout);
            target.classList.remove('active', 'moving', 'bomb', 'gold', 'normal');
            
            gameInterval = setInterval(() => {
                timeLeft--;
                if(timeLeft < 0) timeLeft = 0;
                timeDisplay.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            moveTarget();
        }

        function updateUI() {
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            levelDisplay.textContent = level;
        }

        function moveTarget() {
            if (!gameActive) return;

            target.classList.remove('active', 'moving', 'bomb', 'gold', 'normal');
            
            const padding = 50;
            const maxX = gameArea.clientWidth - padding;
            const maxY = gameArea.clientHeight - padding;
            
            const randomX = Math.floor(Math.random() * (maxX - padding + 1)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding + 1)) + padding;

            target.style.left = `${randomX}px`;
            target.style.top = `${randomY}px`;

            // تحديد نوع الهدف (مفاجآت)
            const rand = Math.random();
            currentTargetType = 'normal';
            
            // الأهداف الخاصة تبدأ بالظهور من النقطة 5
            if (score >= 5) {
                if (rand < 0.15) currentTargetType = 'bomb'; // 15% فرصة للقنبلة
                else if (rand < 0.30) currentTargetType = 'gold'; // 15% فرصة للذهبي
            }

            target.classList.add(currentTargetType);

            // إذا كان المستوى 3 أو أكثر، الأهداف تتحرك
            if (level >= 3) {
                target.classList.add('moving');
            }

            requestAnimationFrame(() => {
                target.classList.add('active');
            });

            clearTimeout(targetTimeout);
            targetTimeout = setTimeout(() => {
                if (gameActive) {
                    if (currentTargetType === 'normal') playSound('bomb'); // صوت اختفاء
                    target.classList.remove('active', 'moving');
                    setTimeout(moveTarget, 200);
                }
            }, currentLifespan);
        }

        // النقر على الهدف
        target.addEventListener('pointerdown', (e) => {
            if (!gameActive) return;
            e.preventDefault();
            
            if (currentTargetType === 'bomb') {
                // مفاجأة: قنبلة
                timeLeft = Math.max(0, timeLeft - 3);
                playSound('bomb');
                gameArea.classList.add('shake');
                setTimeout(() => gameArea.classList.remove('shake'), 300);
                createParticles(e.clientX, e.clientY, '#ff0055');
            } 
            else if (currentTargetType === 'gold') {
                // مفاجأة: وقت إضافي
                score++; // يعطي نقطة أيضاً
                timeLeft += 3;
                playSound('gold');
                createParticles(e.clientX, e.clientY, '#ffcc00');
            } 
            else {
                // هدف عادي
                score++;
                playSound('hit');
                createParticles(e.clientX, e.clientY, '#00f3ff');
            }

            updateUI();
            checkLevelUp();

            target.classList.remove('active', 'moving');
            clearTimeout(targetTimeout);
            
            setTimeout(() => {
                if(gameActive) moveTarget();
            }, 50);
        });

        function checkLevelUp() {
            // نرفع المستوى كل 10 نقاط
            if (score >= level * 10) {
                level++;
                
                // تسريع اللعبة في كل مستوى (نقصان وقت بقاء الهدف)
                currentLifespan = Math.max(350, 900 - (level * 100));
                
                // إظهار إشعار المستوى
                levelUpText.classList.remove('show');
                void levelUpText.offsetWidth; // trigger reflow
                levelUpText.classList.add('show');
                levelUpText.textContent = `LEVEL ${level}!`;
                
                updateUI();
            }
        }

        function createParticles(x, y, color) {
            const rect = gameArea.getBoundingClientRect();
            const relX = x - rect.left;
            const relY = y - rect.top;

            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = `${relX}px`;
                particle.style.top = `${relY}px`;
                particle.style.background = color;
                particle.style.boxShadow = `0 0 10px ${color}`;
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 60 + 20;
                particle.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--y', `${Math.sin(angle) * distance}px`);

                gameArea.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }
        }

        function endGame() {
            gameActive = false;
            clearInterval(gameInterval);
            clearTimeout(targetTimeout);
            target.classList.remove('active', 'moving');
            
            finalScore.textContent = score;
            endLevel.textContent = level;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neonReflexHighScore', highScore);
                endHighScoreMsg.innerHTML = `🎉 رقم قياسي جديد! 🎉<br>أعلى نتيجة: ${highScore}`;
                endHighScoreMsg.style.color = 'var(--neon-gold)';
                endHighScoreMsg.style.background = 'rgba(255, 204, 0, 0.15)';
            } else {
                endHighScoreMsg.innerHTML = `أعلى نتيجة: ${highScore}`;
                endHighScoreMsg.style.color = '#fff';
                endHighScoreMsg.style.background = 'rgba(255, 255, 255, 0.1)';
            }
            
            highScoreDisplay.textContent = highScore;
            endScreen.classList.remove('hidden');
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
