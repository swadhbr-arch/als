<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Reflex | Stage Mode</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --neon-red: #ff0055;
            --neon-gold: #ffcc00;
            --neon-green: #00ff66;
            --bg-color: #050510;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle at center, rgba(0, 243, 255, 0.05) 0%, transparent 60%);
        }

        .game-container {
            position: relative;
            width: 100%; max-width: 500px; height: 100vh; max-height: 850px;
            background: rgba(10, 15, 30, 0.85);
            border: 2px solid rgba(0, 243, 255, 0.2);
            border-radius: 1rem;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.15), inset 0 0 20px rgba(0, 243, 255, 0.1);
            overflow: hidden;
            cursor: crosshair;
            display: flex; flex-direction: column;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.4s;
        }

        /* وضع الظلام للمرحلة 7 */
        .game-container.dark-mode {
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.12) 0px, rgba(2,2,8,0.97) 130px);
        }

        /* تأثير الارتجاج */
        .game-container.shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--neon-red);
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.4), inset 0 0 30px rgba(255, 0, 85, 0.2);
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* ===== شريط الحالة العلوي ===== */
        .hud {
            padding: 1rem 1.2rem;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(5,5,16,0.95) 0%, transparent 100%);
            display: flex; flex-direction: column; gap: 8px;
        }

        .hud-top {
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .stat-box { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 0.7rem; color: #8892b0; font-weight: 700; letter-spacing: 1px; }
        .stat-value { font-size: 1.5rem; font-weight: 900; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); line-height: 1; }
        
        .stage-value { color: var(--neon-gold); text-shadow: 0 0 10px var(--neon-gold); }
        .time-value { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }

        /* المهمة */
        .mission-bar {
            background: rgba(255,255,255,0.1); border-radius: 10px; padding: 6px 12px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.85rem; font-weight: 700; color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .mission-target { color: var(--neon-blue); font-size: 1rem; }

        /* شريط الوقت */
        .time-bar-bg {
            width: 100%; height: 6px; background: rgba(255,255,255,0.1);
            border-radius: 10px; overflow: hidden; position: relative;
        }
        .time-bar-fill {
            height: 100%; width: 100%; background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
            transition: width 1s linear, background-color 0.3s;
        }

        /* ===== الأهداف ===== */
        .target {
            position: absolute; border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            cursor: pointer; z-index: 5; display: none;
            transition: left 0.08s ease-out, top 0.08s ease-out;
        }

        .target.normal {
            width: 55px; height: 55px;
            background: var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 15px #fff;
        }

        .target.gold {
            width: 55px; height: 55px;
            background: var(--neon-gold);
            box-shadow: 0 0 25px var(--neon-gold), inset 0 0 15px #fff;
            border: 2px solid #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .target.gold::after {
            content: '\f005'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            font-size: 1.5rem; color: #fff; text-shadow: 0 0 5px #000;
        }

        .target.bomb {
            width: 55px; height: 55px;
            background: var(--neon-red);
            box-shadow: 0 0 25px var(--neon-red), inset 0 0 15px #fff;
            border: 2px solid #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .target.bomb::after {
            content: '\f1e2'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            font-size: 1.5rem; color: #fff;
        }

        .target.active {
            display: flex;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn { to { transform: translate(-50%, -50%) scale(1); } }

        /* حركة الأهداف */
        .target.moving {
            animation: popIn 0.2s forwards, floatTarget 1.6s infinite alternate ease-in-out;
        }
        @keyframes floatTarget {
            0% { margin-left: -30px; margin-top: -20px; }
            100% { margin-left: 30px; margin-top: 20px; }
        }

        /* تأثير التقلص */
        .target.shrinking {
            animation: popIn 0.2s forwards, shrinkAnim 1.5s linear forwards;
        }
        @keyframes shrinkAnim {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(0.25); opacity: 0.2; }
        }

        /* تأثير الخداع البصري (دوران ووميض) */
        .target.glitchy {
            border-radius: 28%;
            animation: popIn 0.2s forwards, glitchSpin 0.9s infinite linear;
        }
        @keyframes glitchSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); filter: hue-rotate(0deg); }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(0.75); filter: hue-rotate(180deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); filter: hue-rotate(360deg); }
        }

        /* حركة الجاذبية والارتداد */
        .target.bouncy {
            animation: popIn 0.2s forwards, bounceWild 0.75s infinite alternate cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        @keyframes bounceWild {
            0% { transform: translate(-50%, -50%) translateY(-35px) scale(1.1); }
            100% { transform: translate(-50%, -50%) translateY(35px) scale(0.85); }
        }

        /* ===== الجزيئات ===== */
        .particle {
            position: absolute; border-radius: 50%; pointer-events: none; z-index: 4;
            transform: translate(-50%, -50%); animation: explode 0.6s ease-out forwards;
        }
        @keyframes explode {
            to { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0); opacity: 0; }
        }

        /* النصوص الطائرة */
        .floating-text {
            position: absolute; font-size: 1.5rem; font-weight: 900;
            pointer-events: none; z-index: 20;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 10px currentColor;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1.2); opacity: 0; }
        }

        /* ===== الشاشات ===== */
        .overlay {
            position: absolute; inset: 0; background: rgba(5, 5, 16, 0.95);
            backdrop-filter: blur(12px); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 30;
            text-align: center; padding: 2rem; transition: opacity 0.3s ease;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }

        .game-title { font-size: 2.5rem; font-weight: 900; color: #fff; margin-bottom: 0.5rem; text-shadow: 0 0 15px rgba(255, 255, 255, 0.5); }
        .game-title span { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }
        .game-desc { font-size: 1rem; color: #a0aabf; margin-bottom: 2rem; line-height: 1.6; }

        .btn {
            padding: 1rem 3rem; font-size: 1.2rem; font-weight: 800;
            color: #000; background: var(--neon-blue); border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 0 20px var(--neon-blue); transition: all 0.2s;
            display: flex; align-items: center; gap: 10px; justify-content: center;
        }
        .btn:hover { background: #fff; box-shadow: 0 0 30px #fff, 0 0 10px var(--neon-blue); transform: scale(1.05); }

        /* شاشة الانتقال بين المراحل */
        #stageClearScreen { background: rgba(5, 15, 5, 0.95); }
        .stage-clear-title { color: var(--neon-green); text-shadow: 0 0 20px var(--neon-green); font-size: 3rem; margin-bottom: 1rem; animation: pulse 1s infinite alternate; }
        
        @keyframes pulse { from { transform: scale(0.95); } to { transform: scale(1.05); } }

        /* إحصائيات النهاية */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-bottom: 2rem; }
        .stat-item { background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); }
        .stat-item span { display: block; }
        .stat-item .val { font-size: 1.5rem; font-weight: 900; color: var(--neon-blue); }
        .stat-item .lbl { font-size: 0.8rem; color: #8892b0; }
    </style>
</head>
<body>

    <div class="game-container" id="gameArea">
        
        <!-- شريط الحالة -->
        <div class="hud">
            <div class="hud-top">
                <div class="stat-box">
                    <span class="stat-label">Score</span>
                    <span class="stat-value" id="scoreDisplay">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Stage</span>
                    <span class="stat-value stage-value" id="stageDisplay">1</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Time</span>
                    <span class="stat-value time-value" id="timeDisplay">20</span>
                </div>
            </div>
            
            <!-- شريط المهمة (كم هدف متبقي) -->
            <div class="mission-bar">
                <span>المهمة: اصطد <span class="mission-target" id="missionCurrent">0</span> / <span id="missionRequired">10</span></span>
                <span id="stageObjective" style="color: var(--neon-gold);">الإحماء</span>
            </div>

            <div class="time-bar-bg">
                <div class="time-bar-fill" id="timeBar"></div>
            </div>
        </div>

        <!-- الهدف -->
        <div class="target" id="target"></div>

        <!-- شاشة البداية -->
        <div class="overlay" id="startScreen">
            <h1 class="game-title">NEON <span>STAGES</span></h1>
            <p class="game-desc">10 مراحل بتحديات غريبة وممتعة!<br>احذر القنابل واقتنص النجوم الذهبية.</p>
            <button class="btn" id="startBtn"><i class="fas fa-play"></i> ابدأ الرحلة</button>
        </div>

        <!-- شاشة نجاح المرحلة -->
        <div class="overlay hidden" id="stageClearScreen">
            <h1 class="stage-clear-title">STAGE CLEAR!</h1>
            <p class="game-desc" style="color: #fff; font-size: 1.2rem;">أحسنت! لقد اجتزت المرحلة بنجاح.</p>
            <button class="btn" id="nextStageBtn" style="background: var(--neon-green); box-shadow: 0 0 20px var(--neon-green); color: #000;">المرحلة التالية <i class="fas fa-arrow-left"></i></button>
        </div>

        <!-- شاشة النهاية (الخسارة أو الفوز الكامل) -->
        <div class="overlay hidden" id="endScreen">
            <h1 class="game-title" id="endTitle" style="color: var(--neon-red);">انتهت اللعبة</h1>
            <p class="game-desc" id="endMessage" style="color: var(--neon-red); font-weight: bold;"></p>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="val" id="finalScore">0</span>
                    <span class="lbl">النقاط</span>
                </div>
                <div class="stat-item">
                    <span class="val" id="finalStage" style="color: var(--neon-gold);">1</span>
                    <span class="lbl">وصلت للمرحلة</span>
                </div>
            </div>
            
            <button class="btn" id="restartBtn"><i class="fas fa-rotate-right"></i> إعادة المحاولة</button>
        </div>

    </div>

    <script>
        // ================= إعدادات المراحل (10 مراحل متنوعة) =================
        const stagesConfig = [
            { stage: 1, name: "الإحماء", required: 10, time: 20, hasBombs: false, hasGold: false, isMoving: false, isShrinking: false, isEvading: false, isGlitchy: false, isDark: false, isBouncy: false, speed: 1050 },
            { stage: 2, name: "احذر القنابل", required: 12, time: 20, hasBombs: true, hasGold: true, isMoving: false, isShrinking: false, isEvading: false, isGlitchy: false, isDark: false, isBouncy: false, speed: 950 },
            { stage: 3, name: "الأهداف المتحركة", required: 14, time: 22, hasBombs: true, hasGold: true, isMoving: true, isShrinking: false, isEvading: false, isGlitchy: false, isDark: false, isBouncy: false, speed: 900 },
            { stage: 4, name: "الدقة والسرعة", required: 15, time: 22, hasBombs: true, hasGold: true, isMoving: true, isShrinking: true, isEvading: false, isGlitchy: false, isDark: false, isBouncy: false, speed: 850 },
            { stage: 5, name: "الهدف الهارب", required: 14, time: 25, hasBombs: true, hasGold: true, isMoving: false, isShrinking: false, isEvading: true, isGlitchy: false, isDark: false, isBouncy: false, speed: 1100 },
            { stage: 6, name: "الخداع البصري", required: 16, time: 24, hasBombs: true, hasGold: true, isMoving: true, isShrinking: false, isEvading: false, isGlitchy: true, isDark: false, isBouncy: false, speed: 900 },
            { stage: 7, name: "الظلام النيوني", required: 15, time: 25, hasBombs: true, hasGold: true, isMoving: false, isShrinking: false, isEvading: false, isGlitchy: false, isDark: true, isBouncy: false, speed: 950 },
            { stage: 8, name: "الجاذبية المقلوبة", required: 18, time: 25, hasBombs: true, hasGold: true, isMoving: false, isShrinking: false, isEvading: false, isGlitchy: false, isDark: false, isBouncy: true, speed: 850 },
            { stage: 9, name: "الفوضى الكهربائية", required: 20, time: 26, hasBombs: true, hasGold: true, isMoving: true, isShrinking: true, isEvading: true, isGlitchy: false, isDark: false, isBouncy: false, speed: 750 },
            { stage: 10, name: "التحدي الأسطوري", required: 24, time: 30, hasBombs: true, hasGold: true, isMoving: true, isShrinking: true, isEvading: true, isGlitchy: true, isDark: false, isBouncy: true, speed: 680 }
        ];

        // العناصر
        const gameArea = document.getElementById('gameArea');
        const target = document.getElementById('target');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const stageDisplay = document.getElementById('stageDisplay');
        const timeDisplay = document.getElementById('timeDisplay');
        const timeBar = document.getElementById('timeBar');
        const missionCurrent = document.getElementById('missionCurrent');
        const missionRequired = document.getElementById('missionRequired');
        const stageObjective = document.getElementById('stageObjective');
        
        // الشاشات والأزرار
        const startScreen = document.getElementById('startScreen');
        const stageClearScreen = document.getElementById('stageClearScreen');
        const endScreen = document.getElementById('endScreen');
        const endTitle = document.getElementById('endTitle');
        const startBtn = document.getElementById('startBtn');
        const nextStageBtn = document.getElementById('nextStageBtn');
        const restartBtn = document.getElementById('restartBtn');

        // متغيرات اللعبة
        let currentStageIndex = 0;
        let score = 0;
        let targetsHit = 0;
        let timeLeft = 0;
        let isPlaying = false;
        
        let gameTimer;
        let targetTimeout;
        let currentTargetType = 'normal';
        let targetX = 0;
        let targetY = 0;

        // الأصوات
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else if (type === 'gold') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1600, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
            } else if (type === 'bomb') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            } else if (type === 'stageClear') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            }

            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // ================= إدارة اللعبة =================
        function initGame() {
            score = 0;
            currentStageIndex = 0;
            startStage(currentStageIndex);
        }

        function startStage(index) {
            const config = stagesConfig[index];
            
            targetsHit = 0;
            timeLeft = config.time;
            isPlaying = true;
            
            stageDisplay.textContent = config.stage;
            missionRequired.textContent = config.required;
            missionCurrent.textContent = "0";
            stageObjective.textContent = config.name;
            scoreDisplay.textContent = score;
            
            gameArea.classList.toggle('dark-mode', config.isDark);
            updateUI();
            
            startScreen.classList.add('hidden');
            stageClearScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            gameArea.classList.remove('shake');
            target.className = 'target';
            
            clearInterval(gameTimer);
            clearTimeout(targetTimeout);

            gameTimer = setInterval(() => {
                timeLeft--;
                updateUI();
                if (timeLeft <= 0) {
                    gameOver("انتهى الوقت!", false);
                }
            }, 1000);

            spawnTarget();
        }

        function updateUI() {
            timeDisplay.textContent = timeLeft;
            const percent = (timeLeft / stagesConfig[currentStageIndex].time) * 100;
            timeBar.style.width = `${Math.max(0, percent)}%`;
            if(timeLeft <= 5) timeBar.style.background = 'var(--neon-red)';
            else timeBar.style.background = 'var(--neon-pink)';
        }

        // ================= ظهور الأهداف =================
        function spawnTarget() {
            if (!isPlaying) return;
            const config = stagesConfig[currentStageIndex];

            target.className = 'target'; 
            
            const padding = 65;
            const topSafe = 135;
            const maxX = gameArea.clientWidth - padding;
            const maxY = gameArea.clientHeight - padding;
            targetX = Math.floor(Math.random() * (maxX - padding + 1)) + padding;
            targetY = Math.floor(Math.random() * (maxY - topSafe + 1)) + topSafe;

            target.style.left = `${targetX}px`;
            target.style.top = `${targetY}px`;

            // تحديد نوع الهدف
            currentTargetType = 'normal';
            const roll = Math.random();
            if (config.hasBombs && roll < 0.22) {
                currentTargetType = 'bomb';
            } else if (config.hasGold && roll > 0.85) {
                currentTargetType = 'gold';
            }

            target.classList.add(currentTargetType);

            // تأثيرات المراحل الغريبة
            if (config.isMoving) target.classList.add('moving');
            if (config.isShrinking) target.classList.add('shrinking');
            if (config.isGlitchy) target.classList.add('glitchy');
            if (config.isBouncy) target.classList.add('bouncy');

            requestAnimationFrame(() => target.classList.add('active'));

            clearTimeout(targetTimeout);
            targetTimeout = setTimeout(() => {
                if (isPlaying) {
                    target.classList.remove('active', 'moving', 'shrinking', 'glitchy', 'bouncy');
                    setTimeout(spawnTarget, 140);
                }
            }, config.speed);
        }

        // حركة الهروب والكشاف
        gameArea.addEventListener('pointermove', (e) => {
            const rect = gameArea.getBoundingClientRect();
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;

            if (stagesConfig[currentStageIndex]?.isDark) {
                gameArea.style.setProperty('--mx', `${px}px`);
                gameArea.style.setProperty('--my', `${py}px`);
            }

            if (!isPlaying || currentTargetType === 'bomb') return;
            if (stagesConfig[currentStageIndex]?.isEvading && target.classList.contains('active')) {
                const dx = targetX - px;
                const dy = targetY - py;
                const dist = Math.hypot(dx, dy);

                if (dist < 85 && dist > 0) {
                    const step = 38;
                    const pad = 55;
                    targetX = Math.min(gameArea.clientWidth - pad, Math.max(pad, targetX + (dx / dist) * step));
                    targetY = Math.min(gameArea.clientHeight - pad, Math.max(135, targetY + (dy / dist) * step));
                    target.style.left = `${targetX}px`;
                    target.style.top = `${targetY}px`;
                }
            }
        });

        // ================= النقر =================
        target.addEventListener('pointerdown', (e) => {
            if (!isPlaying) return;
            e.preventDefault();
            e.stopPropagation();
            
            const rect = gameArea.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            if (currentTargetType === 'bomb') {
                timeLeft = Math.max(0, timeLeft - 3);
                playSound('bomb');
                gameArea.classList.add('shake');
                setTimeout(() => gameArea.classList.remove('shake'), 400);
                createParticles(clickX, clickY, '#ff0055');
                showFloatingText(clickX, clickY, '-3s', '#ff0055');
                updateUI();
            } else if (currentTargetType === 'gold') {
                score += 25;
                timeLeft += 1;
                targetsHit++;
                scoreDisplay.textContent = score;
                missionCurrent.textContent = targetsHit;
                playSound('gold');
                createParticles(clickX, clickY, '#ffcc00');
                showFloatingText(clickX, clickY, '+25 +1s', '#ffcc00');
                updateUI();
            } else {
                score += 10;
                targetsHit++;
                scoreDisplay.textContent = score;
                missionCurrent.textContent = targetsHit;
                playSound('hit');
                createParticles(clickX, clickY, '#00f3ff');
                showFloatingText(clickX, clickY, '+10', '#00f3ff');
            }

            if (targetsHit >= stagesConfig[currentStageIndex].required) {
                stageClear();
                return;
            }

            target.classList.remove('active', 'moving', 'shrinking', 'glitchy', 'bouncy');
            clearTimeout(targetTimeout);
            
            setTimeout(() => {
                if(isPlaying) spawnTarget();
            }, 50);
        });

        // ================= إنهاء المرحلة =================
        function stageClear() {
            isPlaying = false;
            clearInterval(gameTimer);
            clearTimeout(targetTimeout);
            target.className = 'target';
            gameArea.classList.remove('dark-mode');
            playSound('stageClear');
            
            stageClearScreen.classList.remove('hidden');
        }

        function nextStage() {
            currentStageIndex++;
            if (currentStageIndex < stagesConfig.length) {
                startStage(currentStageIndex);
            } else {
                gameOver("أنت بطل! أكملت جميع المراحل العشر!", true);
            }
        }

        function gameOver(msg, isWin) {
            isPlaying = false;
            clearInterval(gameTimer);
            clearTimeout(targetTimeout);
            target.className = 'target';
            gameArea.classList.remove('dark-mode');
            
            endTitle.textContent = isWin ? "مبروك الفوز!" : "انتهت اللعبة";
            endTitle.style.color = isWin ? "var(--neon-green)" : "var(--neon-red)";
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalStage').textContent = stagesConfig[currentStageIndex].stage;
            document.getElementById('endMessage').textContent = msg;
            document.getElementById('endMessage').style.color = isWin ? "var(--neon-green)" : "var(--neon-red)";
            
            endScreen.classList.remove('hidden');
        }

        // ================= التأثيرات =================
        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                particle.style.background = color;
                particle.style.boxShadow = `0 0 10px ${color}`;
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 60 + 20;
                particle.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--y', `${Math.sin(angle) * distance}px`);

                gameArea.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }
        }

        function showFloatingText(x, y, text, color) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            gameArea.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        // ================= المستمعات =================
        startBtn.addEventListener('click', initGame);
        nextStageBtn.addEventListener('click', nextStage);
        restartBtn.addEventListener('click', initGame);
        
        document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
