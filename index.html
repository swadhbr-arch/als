<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>العقل المدبر | تحويل PDF إلى اختبار</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة قراءة ملفات PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        :root {
            --bg-color: #080a10;
            --card-bg: rgba(20, 25, 40, 0.7);
            --primary: #00f3ff;
            --secondary: #7000ff;
            --success: #00ff66;
            --danger: #ff0055;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #ffcc00;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.1) 0%, transparent 40%);
        }

        .app-container {
            position: relative;
            width: 100%; max-width: 550px; height: 100vh; max-height: 850px;
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        .app-container.shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--danger);
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* ===== الشريط العلوي ===== */
        .hud {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10;
        }

        .hud-item { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text-muted); }
        .score-val { color: var(--primary); font-size: 1.2rem; }
        .lives-val { font-size: 1.2rem; letter-spacing: 2px; }
        
        /* مؤقت الـ 2 دقيقة */
        .global-timer { 
            color: var(--gold); font-size: 1.3rem; font-weight: 900;
            display: flex; align-items: center; gap: 5px;
        }
        .global-timer.danger { color: var(--danger); animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { transform: scale(0.95); } to { transform: scale(1.05); } }

        /* ===== منطقة اللعب ===== */
        .play-area {
            flex: 1; display: flex; flex-direction: column;
            padding: 20px; position: relative; overflow-y: auto;
        }

        /* شاشة رفع الملف */
        .upload-screen {
            display: flex; flex-direction: column; height: 100%; gap: 15px;
            justify-content: center; align-items: center;
        }

        .upload-title {
            font-size: 1.5rem; font-weight: 900; color: #fff; text-align: center;
            margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .upload-subtitle {
            font-size: 0.9rem; color: var(--text-muted); text-align: center;
            line-height: 1.6; margin-bottom: 20px;
        }

        .drop-zone {
            width: 100%; height: 200px;
            border: 3px dashed rgba(255,255,255,0.2);
            border-radius: 20px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s;
            background: rgba(255,255,255,0.02);
            position: relative; overflow: hidden;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: rgba(0, 243, 255, 0.05);
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.1);
        }

        .drop-zone i {
            font-size: 3.5rem; color: var(--primary); margin-bottom: 15px;
            transition: transform 0.3s;
        }
        .drop-zone:hover i { transform: translateY(-5px) scale(1.1); }

        .drop-zone p { font-size: 1.1rem; font-weight: 700; color: #fff; }
        .drop-zone span { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }

        input[type="file"] { display: none; }

        /* شاشة التحميل */
        .loading-screen {
            display: none; flex-direction: column; height: 100%;
            justify-content: center; align-items: center; gap: 20px;
        }
        .loader {
            width: 60px; height: 60px; border-radius: 50%;
            border: 5px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 1.2rem; font-weight: 700; color: var(--primary); animation: pulse 1s infinite alternate; }

        /* شاشة الأسئلة */
        .question-screen {
            display: none; flex-direction: column; height: 100%; gap: 20px;
            justify-content: center;
        }

        .question-text {
            background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px;
            font-size: 1.15rem; font-weight: 700; color: #fff; line-height: 1.8;
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .blank-highlight {
            color: var(--primary); font-weight: 900; border-bottom: 3px solid var(--primary);
            padding: 0 5px; letter-spacing: 2px;
        }

        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }

        .option-btn {
            background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 15px; border-radius: 12px; font-size: 1.05rem;
            font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center;
            font-family: 'Cairo', sans-serif;
        }
        .option-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--primary); }
        
        .option-btn.correct {
            background: var(--success); border-color: var(--success); color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }
        .option-btn.wrong {
            background: var(--danger); border-color: var(--danger); color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }

        /* شاشة النهاية */
        .overlay {
            position: absolute; inset: 0; background: rgba(8, 10, 16, 0.95);
            backdrop-filter: blur(10px); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 50;
            text-align: center; padding: 20px;
        }
        .overlay.hidden { display: none; }

        .result-emoji { font-size: 6rem; margin-bottom: 15px; animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
        
        .rank-text { font-size: 1.5rem; font-weight: 900; color: var(--primary); margin-bottom: 10px; }
        .final-score { font-size: 1.2rem; color: #fff; margin-bottom: 30px; }

        .btn {
            padding: 15px 30px; font-size: 1.1rem; font-weight: 900;
            color: #000; background: var(--primary); border: none; border-radius: 50px;
            cursor: pointer; transition: all 0.2s; width: 100%;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            font-family: 'Cairo', sans-serif;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:hover { background: #fff; box-shadow: 0 0 30px #fff; transform: scale(1.02); }

        /* النصوص الطائرة */
        .floating-text {
            position: absolute; font-size: 2rem; font-weight: 900;
            pointer-events: none; z-index: 20;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px currentColor;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appWrapper">
        
        <!-- الشريط العلوي -->
        <div class="hud" id="hud" style="display: none;">
            <div class="hud-item">النقاط: <span class="score-val" id="scoreVal">0</span></div>
            <div class="global-timer" id="globalTimer"><i class="fas fa-stopwatch"></i> 02:00</div>
            <div class="hud-item lives-val" id="livesVal">❤️❤️❤️</div>
        </div>

        <!-- منطقة اللعب -->
        <div class="play-area" id="playArea">
            
            <!-- شاشة رفع الملف -->
            <div class="upload-screen" id="uploadScreen">
                <div class="upload-title">العقل المدبر 🧠</div>
                <div class="upload-subtitle">
                    ارفع ملف PDF (ملخص، محاضرة، كتاب) وسيقوم التطبيق<br>
                    بقراءته وتوليد اختبار ذكي لك خلال 2 دقيقة!
                </div>
                
                <div class="drop-zone" id="dropZone">
                    <i class="fas fa-file-pdf"></i>
                    <p>اسحب ملف الـ PDF هنا أو اضغط للاختيار</p>
                    <span>يدعم ملفات PDF فقط</span>
                    <input type="file" id="fileInput" accept=".pdf">
                </div>
            </div>

            <!-- شاشة التحميل (أثناء قراءة الـ PDF) -->
            <div class="loading-screen" id="loadingScreen">
                <div class="loader"></div>
                <div class="loading-text" id="loadingText">جاري استخراج النص وتحليل المعلومات...</div>
            </div>

            <!-- شاشة الأسئلة -->
            <div class="question-screen" id="questionScreen">
                <div class="question-text" id="questionText">
                    سيظهر السؤال هنا...
                </div>
                <div class="options-grid" id="optionsContainer"></div>
            </div>

        </div>

        <!-- شاشة النهاية -->
        <div class="overlay hidden" id="endScreen">
            <div class="result-emoji" id="resultEmoji">🎓</div>
            <div class="rank-text" id="rankText">رتبتك</div>
            <div class="final-score" id="finalScoreText">نقاطك: 0</div>
            <button class="btn" id="restartBtn"><i class="fas fa-rotate-right"></i> العودة للبداية</button>
        </div>

    </div>

    <script>
        // إعداد مسار عمل مكتبة PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // ================= العناصر =================
        const appWrapper = document.getElementById('appWrapper');
        const hud = document.getElementById('hud');
        const globalTimerEl = document.getElementById('globalTimer');
        
        const uploadScreen = document.getElementById('uploadScreen');
        const loadingScreen = document.getElementById('loadingScreen');
        const loadingText = document.getElementById('loadingText');
        const questionScreen = document.getElementById('questionScreen');
        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        
        const scoreVal = document.getElementById('scoreVal');
        const livesVal = document.getElementById('livesVal');
        
        const endScreen = document.getElementById('endScreen');
        const restartBtn = document.getElementById('restartBtn');

        // ================= متغيرات اللعبة =================
        let score = 0;
        let lives = 3;
        let isPlaying = false;
        let questions = [];
        let currentQuestionIndex = 0;
        
        // مؤقت الـ 2 دقيقة (120 ثانية)
        let globalTimeLeft = 120; 
        let timerInterval;

        // الأصوات
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            } else if (type === 'generate') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.4);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            }

            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // ================= التعامل مع رفع الملفات =================
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                handleFile(file);
            } else {
                alert("الرجاء إرفاق ملف PDF صالح.");
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        // ================= قراءة الـ PDF =================
        function handleFile(file) {
            uploadScreen.style.display = 'none';
            loadingScreen.style.display = 'flex';
            
            const fileReader = new FileReader();
            
            fileReader.onload = function() {
                const typedarray = new Uint8Array(this.result);
                
                // استخدام مكتبة PDF.js لقراءة الملف
                pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
                    let maxPages = Math.min(pdf.numPages, 10); // قراءة أول 10 صفحات كحد أقصى لسرعة الأداء
                    let countPromises = [];
                    let fullText = "";

                    for (let i = 1; i <= maxPages; i++) {
                        countPromises.push(pdf.getPage(i).then(function(page) {
                            return page.getTextContent().then(function(textContent) {
                                return textContent.items.map(function(s) { return s.str; }).join(" ");
                            });
                        }));
                    }

                    Promise.all(countPromises).then(function(texts) {
                        fullText = texts.join(" \n ");
                        processTextAndStartGame(fullText);
                    });
                }).catch(error => {
                    console.error(error);
                    alert("حدث خطأ أثناء قراءة الملف. تأكد من أن الملف غير محمي بكلمة مرور.");
                    resetToStart();
                });
            };
            
            fileReader.readAsArrayBuffer(file);
        }

        // ================= الخوارزمية الذكية لصنع الأسئلة =================
        function processTextAndStartGame(text) {
            loadingText.textContent = "جاري صياغة الأسئلة بذكاء...";
            
            // مهلة بسيطة لإعطاء انطباع بصري بالمعالجة
            setTimeout(() => {
                // تنظيف النص وإزالة الأسطر الجديدة المتكررة
                text = text.replace(/\s+/g, ' ').trim();
                
                // تقسيم النص إلى جمل
                const sentences = text.match(/[^.!?]+[.!?]+/g) || text.split('.'); 
                
                // تصفية الجمل الطويلة (أكثر من 6 كلمات) لضمان جودتها
                const validSentences = sentences.filter(s => s.trim().split(/\s+/).length >= 6);
                
                if (validSentences.length < 3) {
                    alert("النص المستخرج من الـ PDF قصير جداً أو غير واضح. يرجى استخدام ملف يحتوي على نص حقيقي (وليس صوراً).");
                    resetToStart();
                    return;
                }

                // استخراج الكلمات الفريدة لاستخدامها كإجابات خاطئة
                const allWords = text.match(/[\u0600-\u06FFa-zA-Z]{4,}/g) || []; 
                const uniqueWords = [...new Set(allWords.map(w => w.replace(/[^\u0600-\u06FFa-zA-Z]/g, '')))].filter(w => w.length > 3);

                let generatedQuestions = [];

                validSentences.forEach(sentence => {
                    const words = sentence.trim().split(/\s+/);
                    
                    // البحث عن كلمة عشوائية صالحة (أطول من 4 أحرف)
                    const candidates = words.map((w, i) => ({w, i}))
                        .filter(obj => obj.w.replace(/[^\u0600-\u06FFa-zA-Z]/g, '').length > 4);
                    
                    if (candidates.length > 0) {
                        const targetObj = candidates[Math.floor(Math.random() * candidates.length)];
                        const correctWord = targetObj.w.replace(/[^\u0600-\u06FFa-zA-Z]/g, ''); 
                        
                        let options = [correctWord];
                        
                        // اختيار 3 كلمات خاطئة من نفس النص
                        let attempts = 0;
                        while(options.length < 4 && attempts < 150) {
                            const randomWord = uniqueWords[Math.floor(Math.random() * uniqueWords.length)];
                            if (!options.includes(randomWord)) {
                                options.push(randomWord);
                            }
                            attempts++;
                        }
                        
                        // إنشاء السؤال
                        if (options.length === 4) {
                            const questionString = words.map((w, i) => i === targetObj.i ? '<span class="blank-highlight">______</span>' : w).join(' ');
                            
                            generatedQuestions.push({
                                text: questionString,
                                options: options.sort(() => 0.5 - Math.random()),
                                correct: correctWord
                            });
                        }
                    }
                });

                // خلط الأسئلة وأخذ أول 10 أسئلة لتكون مدة اللعبة مناسبة للمؤقت
                questions = generatedQuestions.sort(() => 0.5 - Math.random()).slice(0, 10);

                if (questions.length > 0) {
                    playSound('generate');
                    startGame();
                } else {
                    alert("لم نتمكن من توليد أسئلة من هذا الملف. جرب ملفاً آخر.");
                    resetToStart();
                }
            }, 1500); // تأخير 1.5 ثانية لمحاكاة التفكير
        }

        // ================= بدء اللعبة =================
        function startGame() {
            score = 0;
            lives = 3;
            currentQuestionIndex = 0;
            globalTimeLeft = 120; // 2 دقيقة
            isPlaying = true;
            
            scoreVal.textContent = score;
            updateLivesUI();
            updateTimerUI();
            
            loadingScreen.style.display = 'none';
            questionScreen.style.display = 'flex';
            hud.style.display = 'flex';
            endScreen.classList.add('hidden');
            
            // بدء المؤقت العام
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                globalTimeLeft--;
                updateTimerUI();
                
                if (globalTimeLeft <= 0) {
                    endGame("انتهى الوقت! (دقيقتان)");
                }
            }, 1000);
            
            loadQuestion();
        }

        function updateLivesUI() {
            livesVal.textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
        }

        function updateTimerUI() {
            const minutes = Math.floor(globalTimeLeft / 60);
            const seconds = globalTimeLeft % 60;
            globalTimerEl.innerHTML = `<i class="fas fa-stopwatch"></i> ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // تحويل اللون للأحمر إذا بقي أقل من 20 ثانية
            if (globalTimeLeft <= 20) {
                globalTimerEl.classList.add('danger');
            } else {
                globalTimerEl.classList.remove('danger');
            }
        }

        // ================= تحميل السؤال =================
        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                endGame("أنت بطل! أكملت جميع الأسئلة");
                return;
            }

            const q = questions[currentQuestionIndex];
            
            questionText.innerHTML = q.text;
            optionsContainer.innerHTML = '';
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.addEventListener('click', () => handleAnswer(btn, opt, q.correct));
                optionsContainer.appendChild(btn);
            });
        }

        // ================= معالجة الإجابات =================
        function handleAnswer(clickedBtn, chosen, correct) {
            if (!isPlaying) return;

            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.style.pointerEvents = 'none');

            if (chosen === correct) {
                playSound('correct');
                clickedBtn.classList.add('correct');
                
                // النقاط تعتمد على الوقت المتبقي (مكافأة السرعة)
                const points = Math.round(10 + (globalTimeLeft * 0.2)); 
                score += points;
                scoreVal.textContent = score;
                
                showFloatingText(clickedBtn, `+${points}`, 'var(--success)');
                
                setTimeout(nextQuestion, 800);
            } else {
                playSound('wrong');
                clickedBtn.classList.add('wrong');
                
                allBtns.forEach(btn => {
                    if (btn.textContent === correct) btn.classList.add('correct');
                });

                appWrapper.classList.add('shake');
                loseLife();
            }
        }

        function loseLife() {
            lives--;
            updateLivesUI();

            setTimeout(() => {
                appWrapper.classList.remove('shake');
                if (lives <= 0) {
                    endGame("نفدت المحاولات!");
                } else {
                    nextQuestion();
                }
            }, 1500);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        // ================= النهاية =================
        function endGame(msg) {
            isPlaying = false;
            clearInterval(timerInterval);
            
            hud.style.display = 'none';
            questionScreen.style.display = 'none';
            
            let rank = "مبتدئ 🐣";
            let emoji = "📚";
            
            if (score >= 120) { rank = "عبقري 🧠"; emoji = "🏆"; }
            else if (score >= 70) { rank = "متفوق 🌟"; emoji = "🎓"; }
            else if (score >= 30) { rank = "طالب مجتهد 📖"; emoji = "📝"; }

            document.getElementById('finalScoreText').textContent = `نقاطك: ${score} | ${msg}`;
            document.getElementById('rankText').textContent = `رتبتك: ${rank}`;
            document.getElementById('resultEmoji').textContent = emoji;
            
            endScreen.classList.remove('hidden');
        }

        // ================= التأثيرات =================
        function showFloatingText(element, text, color) {
            const rect = element.getBoundingClientRect();
            const appRect = appWrapper.getBoundingClientRect();
            
            const x = rect.left - appRect.left + rect.width / 2;
            const y = rect.top - appRect.top;

            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            
            appWrapper.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // العودة للبداية
        restartBtn.addEventListener('click', resetToStart);

        function resetToStart() {
            endScreen.classList.add('hidden');
            loadingScreen.style.display = 'none';
            questionScreen.style.display = 'none';
            uploadScreen.style.display = 'flex';
            hud.style.display = 'none';
            fileInput.value = '';
            clearInterval(timerInterval);
        }

        document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
