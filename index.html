<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الدردشة الأسطورية | Legendary Chat</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-dark: #05050a;
            --bg-panel: rgba(20, 25, 40, 0.72);
            --accent: #00f3ff;
            --accent-secondary: #ff0055;
            --accent-glow: rgba(0, 243, 255, 0.35);
            --neon-green: #00ff66;
            --text-main: #f8fafc;
            --text-muted: #8892b0;
            --my-msg: linear-gradient(135deg, #00f3ff, #0055ff);
            --other-msg: rgba(255, 255, 255, 0.08);
            --bg-glow-1: rgba(0, 243, 255, 0.09);
            --bg-glow-2: rgba(255, 0, 85, 0.08);
        }

        body[data-theme="purple"] {
            --accent: #b84dff;
            --accent-secondary: #ff2a85;
            --accent-glow: rgba(184, 77, 255, 0.35);
            --my-msg: linear-gradient(135deg, #b84dff, #6a00ff);
            --bg-glow-1: rgba(184, 77, 255, 0.12);
            --bg-glow-2: rgba(255, 42, 133, 0.08);
        }

        body[data-theme="emerald"] {
            --accent: #00f5a0;
            --accent-secondary: #00d9f5;
            --accent-glow: rgba(0, 245, 160, 0.35);
            --my-msg: linear-gradient(135deg, #00f5a0, #009e60);
            --bg-glow-1: rgba(0, 245, 160, 0.11);
            --bg-glow-2: rgba(0, 217, 245, 0.08);
        }

        body[data-theme="gold"] {
            --accent: #ffd166;
            --accent-secondary: #ff7b00;
            --accent-glow: rgba(255, 209, 102, 0.35);
            --my-msg: linear-gradient(135deg, #ffd166, #d48806);
            --bg-glow-1: rgba(255, 209, 102, 0.12);
            --bg-glow-2: rgba(255, 123, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 15% 50%, var(--bg-glow-1), transparent 28%),
                radial-gradient(circle at 85% 30%, var(--bg-glow-2), transparent 28%);
            transition: background 0.35s ease;
        }

        .app-container {
            position: relative;
            width: 100%;
            max-width: 550px;
            height: 100dvh; 
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 0 50px var(--accent-glow);
            border-left: 1px solid rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        /* ===== شريط حقوق المطور ===== */
        .dev-banner {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.08));
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            padding: 9px 10px;
            font-size: 0.84rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            z-index: 10;
        }
        .dev-banner span { 
            color: var(--accent);
            font-size: 0.98rem;
            font-weight: 900;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* ===== الشاشات ===== */
        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
            height: 100%;
            overflow: hidden;
        }
        .screen.active { display: flex; }

        /* ===== 1. شاشة تسجيل الدخول / إنشاء الحساب ===== */
        #authScreen {
            padding: 20px;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }
        
        .auth-card {
            width: 100%;
            background: var(--bg-panel);
            padding: 25px 20px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            text-align: center;
        }

        .title { 
            font-size: 1.9rem;
            font-weight: 900;
            margin-bottom: 4px; 
            background: linear-gradient(to right, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 20px;
        }

        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: rgba(0,0,0,0.35);
            padding: 5px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .auth-tab {
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.25s;
        }
        .auth-tab.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid var(--accent);
        }

        .input-group {
            margin-bottom: 14px;
            text-align: right;
        }
        .input-group label {
            display: block;
            color: #ccc;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 0.84rem;
        }
        .input-group input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.45);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .auth-error {
            color: #ff4d79;
            background: rgba(255, 0, 85, 0.12);
            border: 1px solid rgba(255, 0, 85, 0.3);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: none;
        }

        .btn {
            padding: 13px;
            font-size: 0.98rem;
            font-weight: 900;
            color: #05050a; 
            background: linear-gradient(135deg, var(--accent), #0088ff);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 5px 15px var(--accent-glow);
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-outline { 
            background: transparent;
            color: var(--accent-secondary);
            border: 2px solid var(--accent-secondary); 
        }
        .btn-outline:hover {
            background: var(--accent-secondary);
            color: #fff;
        }

        /* ===== 2. شاشة الأصدقاء والغرف والثيمات ===== */
        .top-bar {
            background: rgba(15, 20, 30, 0.92);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .avatar-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #05050a;
            font-size: 1.05rem;
            flex-shrink: 0;
        }
        .user-meta .uname {
            font-weight: 900;
            font-size: 0.96rem;
            color: #fff;
        }
        .user-meta .u-bio {
            font-size: 0.74rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .user-meta .u-bio:hover { color: var(--accent); }

        .btn-logout {
            background: rgba(255, 0, 85, 0.12);
            color: #ff4d79;
            border: 1px solid rgba(255, 0, 85, 0.35);
            padding: 7px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.8rem;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .btn-logout:hover { background: #ff0055; color: #fff; }

        .home-tabs {
            display: flex;
            background: rgba(12, 16, 26, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .home-tab {
            flex: 1;
            padding: 11px 6px;
            text-align: center;
            font-weight: 800;
            font-size: 0.84rem;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }
        .home-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(255, 255, 255, 0.03);
        }

        .home-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .home-content::-webkit-scrollbar { width: 4px; }
        .home-content::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .add-friend-box {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .add-friend-box input {
            flex: 1;
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.45);
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }
        .add-friend-box input:focus { border-color: var(--accent); }
        .add-friend-box button {
            padding: 0 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent), #0088ff);
            color: #05050a;
            font-weight: 900;
            cursor: pointer;
            font-size: 0.88rem;
            white-space: nowrap;
        }

        .friend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            padding: 12px 14px;
            border-radius: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .friend-item:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .friend-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        .friend-avatar {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1rem;
            color: var(--accent);
            flex-shrink: 0;
        }
        .status-dot {
            position: absolute;
            bottom: 1px;
            left: 1px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            border: 2px solid #090d16;
            background: #555;
        }
        .status-dot.online {
            background: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
        }
        .friend-info .fname {
            font-weight: 800;
            font-size: 0.95rem;
            color: #fff;
        }
        .friend-info .flast {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 2px;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .friend-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .unread-badge {
            background: var(--accent-secondary);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 900;
            min-width: 20px;
            height: 20px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .theme-card {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 15px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .theme-card.active {
            border-color: var(--accent);
            background: rgba(255,255,255,0.09);
            box-shadow: 0 0 18px var(--accent-glow);
        }
        .theme-swatch {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            margin: 0 auto 8px;
        }
        .theme-name {
            font-weight: 800;
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 35px 15px;
            font-size: 0.9rem;
            line-height: 1.7;
        }

        /* ===== 3. شاشة الدردشة ===== */
        #chatScreen { background: transparent; }

        .chat-header {
            background: rgba(15, 20, 30, 0.92);
            backdrop-filter: blur(10px);
            padding: 11px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
            z-index: 5;
            gap: 8px;
        }
        
        .chat-header-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .chat-room-code {
            font-weight: 900;
            font-size: 1rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .copy-code-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 8px;
            padding: 1px 7px;
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
        }
        .chat-status {
            font-size: 0.73rem;
            color: var(--neon-green);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .icon-btn-sm {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }
        .icon-btn-sm:hover { border-color: var(--accent); color: var(--accent); }

        .btn-leave {
            background: rgba(255, 0, 85, 0.12);
            color: #ff4d79;
            border: 1px solid rgba(255, 0, 85, 0.35);
            padding: 7px 11px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .btn-leave:hover { background: #ff0055; color: #fff; }

        .search-bar-box {
            display: none;
            padding: 8px 14px;
            background: rgba(12, 16, 26, 0.96);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .search-bar-box.active { display: flex; }
        .search-bar-box input {
            flex: 1;
            padding: 7px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.45);
            color: #fff;
            outline: none;
            font-size: 0.86rem;
        }

        .pinned-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border-right: 3px solid var(--accent);
            padding: 7px 14px;
            font-size: 0.78rem;
            color: #fff;
            flex-shrink: 0;
            gap: 8px;
        }
        .pinned-bar.active { display: flex; }
        .pinned-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-messages {
            flex: 1;
            padding: 16px 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: slideUp 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-wrapper.me { align-self: flex-end; }
        .message-wrapper.other { align-self: flex-start; }

        .msg-name {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: bold;
            margin-right: 5px;
        }

        .reply-quote {
            background: rgba(0, 0, 0, 0.28);
            border-right: 3px solid var(--neon-green);
            padding: 5px 9px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.76rem;
            color: rgba(255, 255, 255, 0.88);
        }
        
        .msg-bubble {
            padding: 11px 15px;
            border-radius: 18px;
            font-size: 0.94rem;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .message-wrapper.me .msg-bubble { 
            background: var(--my-msg);
            color: #fff;
            border-bottom-right-radius: 4px; 
            border: 1px solid rgba(255,255,255,0.2);
        }
        .message-wrapper.other .msg-bubble { 
            background: var(--other-msg);
            color: #fff;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(5px);
        }

        .msg-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 5px;
            font-size: 0.65rem;
            opacity: 0.88;
        }

        .msg-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 7px;
            margin-top: 4px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }
        .msg-action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.72rem;
            padding: 2px 4px;
            transition: 0.15s;
        }
        .msg-action-btn:hover { color: var(--accent); }
        .msg-action-btn.del:hover { color: #ff4d79; }

        .reactions-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 5px;
        }
        .reaction-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            padding: 1px 7px;
            font-size: 0.74rem;
            cursor: pointer;
            color: #fff;
            transition: 0.15s;
        }
        .reaction-chip.active {
            background: rgba(255, 255, 255, 0.18);
            border-color: var(--accent);
        }

        .edit-banner, .reply-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.07);
            border-right: 3px solid var(--accent);
            padding: 7px 14px;
            font-size: 0.8rem;
            color: #fff;
            flex-shrink: 0;
        }
        .edit-banner.active, .reply-banner.active { display: flex; }
        .edit-banner button, .reply-banner button {
            background: none;
            border: none;
            color: #ff4d79;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .quick-emojis {
            display: flex;
            gap: 6px;
            padding: 6px 15px 0;
            background: rgba(15, 20, 30, 0.95);
            overflow-x: auto;
            flex-shrink: 0;
        }
        .quick-emoji-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 3px 9px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .quick-emoji-btn:hover {
            transform: scale(1.12);
            border-color: var(--accent);
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: var(--other-msg); 
            padding: 10px 14px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
            margin: 0 15px 8px;
            width: fit-content;
        }
        .typing-indicator.active {
            display: flex;
            gap: 4px;
            align-items: center;
